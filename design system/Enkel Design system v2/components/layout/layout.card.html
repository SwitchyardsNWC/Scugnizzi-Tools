<!-- @dsCard group="Components" viewport="760x460" name="Layout" subtitle="AppShell — static header, scrolling main, right drawer · phone: sheet + tabs" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{padding:16px;margin:0}</style></head><body><div id="root"></div>
<script type="text/babel">
const { AppShell, ShellHeader, TopBar, BottomTabs, ListRow, Panel, PanelSection, Field, Wordmark, SidebarNav, TextLink, Button, DataTable, StatusBadge } = window.ArtVentoryDesignSystem_f8dda9;
const nav=[{id:'work',label:'My work'},{id:'projects',label:'Projects'},{id:'warehouse',label:'Warehouse'},{id:'library',label:'Library'}];
const rows=[{id:'a',item:'Lounge chair, oak',bin:'A-14',hand:12,res:4,status:'progress'},{id:'b',item:'Side table, brass',bin:'A-15',hand:3,res:3,status:'risk'},{id:'c',item:'Floor lamp',bin:'B-02',hand:6,res:0,status:'done'},{id:'d',item:'Bar stool, walnut',bin:'B-07',hand:18,res:12,status:'progress'},{id:'e',item:'Coat rack',bin:'C-01',hand:2,res:0,status:'notstarted'},{id:'f',item:'Planter, large',bin:'C-04',hand:9,res:9,status:'risk'}];
const cols=[{key:'item',label:'Item',width:160,nowrap:true},{key:'bin',label:'Bin',muted:true},{key:'hand',label:'On hand',align:'right'},{key:'res',label:'Reserved',align:'right'},{key:'free',label:'Free',align:'right',render:r=>r.hand-r.res},{key:'status',label:'Status',render:r=><StatusBadge status={r.status}/>}];
function Inspector({r,onClose}){return <Panel kicker={'Bin '+r.bin} title={r.item} onClose={onClose} footer={<Button size="sm" variant="outline">Reserve</Button>}><PanelSection title="Stock"><Field label="On hand">{r.hand}</Field><Field label="Reserved">{r.res}</Field><Field label="Free">{r.hand-r.res}</Field></PanelSection></Panel>;}
function Desk(){const [a,setA]=React.useState('warehouse');const [sel,setSel]=React.useState('b');const r=rows.find(x=>x.id===sel);
return <div style={{width:400,height:400,border:'1px solid var(--border-hairline)',overflow:'hidden'}}>
<AppShell tier="tablet" width="full" style={{height:'100%'}} rail={<><Wordmark size={17}/><SidebarNav items={nav} activeId={a} onSelect={setA} style={{fontSize:13}}/></>}
  header={<ShellHeader kicker="Atlanta" title="Warehouse" actions={<Button size="sm">Add item</Button>} style={{padding:'10px 21px',minHeight:52}}/>}
  drawer={r?<Inspector r={r} onClose={()=>setSel(null)}/>:null} drawerWidth={200} drawerTitle="Item" onDrawerClose={()=>setSel(null)}>
  <div style={{margin:'-21px -21px 0'}}><DataTable stickyHeader pinFirst columns={cols} rows={rows} selectedKey={sel} onRowClick={x=>setSel(x.id)} style={{fontSize:13}}/></div>
</AppShell></div>;}
function Phone(){const [tab,setTab]=React.useState('warehouse');const [sel,setSel]=React.useState(null);const r=rows.find(x=>x.id===sel);
return <div style={{width:360,height:400,border:'1px solid var(--border-hairline)',overflow:'hidden'}}>
<AppShell tier="phone" style={{height:'100%'}} top={<TopBar title="Warehouse" action={<TextLink onClick={()=>{}}>Filter</TextLink>}/>} tabs={<BottomTabs items={nav} activeId={tab} onSelect={setTab}/>}
  drawer={r?<Inspector r={r} onClose={()=>setSel(null)}/>:null} drawerTitle="Item" onDrawerClose={()=>setSel(null)}>
  {rows.slice(0,4).map(x=><ListRow key={x.id} primary={x.item} secondary={'Bin '+x.bin} meta={(x.hand-x.res)+' free'} onClick={()=>setSel(x.id)}/>)}
</AppShell></div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'flex',gap:16,alignItems:'flex-start'}}><Desk/><Phone/></div>);
</script></body></html>
