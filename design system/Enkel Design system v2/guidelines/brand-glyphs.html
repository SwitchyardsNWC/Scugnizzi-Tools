<!-- @dsCard group="Brand" viewport="700x150" name="Glyphs as icons" subtitle="No icon set — typographic glyphs at text size" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Glyphs as icons</title><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;box-sizing:border-box}
/* Drawn large here so they can be told apart; in use they sit at the size of the words beside them. */
.row{display:flex;gap:28px;font-size:var(--text-heading);line-height:32px}
.lbl{font-size:13px;line-height:16px;letter-spacing:.143px;color:var(--text-muted);white-space:nowrap}
</style></head><body><div class="row">
<div><div>→</div><div class="lbl">open</div></div>
<div><div>←</div><div class="lbl">back</div></div>
<div><div>+</div><div class="lbl">add</div></div>
<div><div>×</div><div class="lbl">remove</div></div>
<div><div>›</div><div class="lbl">more</div></div>
<div><div>▲</div><div class="lbl">up</div></div>
<div><div>▼</div><div class="lbl">down</div></div>
<div><div>■</div><div class="lbl">flat, status</div></div>
<div><div>_</div><div class="lbl">wordmark</div></div>
</div></body></html>
