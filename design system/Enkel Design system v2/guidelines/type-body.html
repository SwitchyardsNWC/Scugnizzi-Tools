<!-- @dsCard group="Type" viewport="700x200" name="Body & caption" subtitle="14px body, 1.5 for prose at 66ch; 13 for labels and hints, 12 for column labels; 16 on phones" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Body and caption</title><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;box-sizing:border-box}
.s{display:grid;grid-template-columns:minmax(0,1fr) 184px;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border-muted)}
.s:first-child{padding-top:0}
.k{font-family:var(--font-mono-detail);font-size:12px;line-height:16px;letter-spacing:0;color:var(--text-muted);white-space:nowrap}
</style></head><body>
<div class="s"><p style="font-size:var(--text-body);line-height:var(--leading-prose);letter-spacing:var(--tracking-body)">Two required items block Design dev. The warehouse has none free in bin L-08; a purchase order covers four, due Sep 12.</p><span class="k">14 · 1.5 · prose</span></div>
<div class="s"><span style="font-size:var(--text-body);line-height:var(--leading-body);letter-spacing:var(--tracking-body)">Booth, 4-seat, oak · Big room</span><span class="k">14 · 1.3 · cells, buttons</span></div>
<div class="s"><span style="font-size:var(--text-meta);line-height:var(--leading-meta);letter-spacing:var(--tracking-meta);color:var(--text-muted)">Lead Mira · updated 2 min ago</span><span class="k">13 · 1.25 · hints, labels</span></div>
<div class="s"><span style="font-size:var(--text-caption);line-height:var(--leading-caption);letter-spacing:var(--tracking-caption);color:var(--text-muted)">Club · Occupancy · Change</span><span class="k">12 · 1.25 · column labels</span></div>
</body></html>
