<!DOCTYPE html><html><head><meta charset="utf-8"><title>Voice</title><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;box-sizing:border-box}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:var(--text-subheading);line-height:24px;letter-spacing:var(--tracking-subheading)}
.say{border-top:1px solid var(--border-hairline);padding-top:8px}
.not{border-top:1px solid var(--border-card);padding-top:8px;color:var(--text-muted)}
.lbl{margin-bottom:4px;font-size:11px;line-height:16px;letter-spacing:.3px;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="cols">
<div class="say"><div class="lbl">Say</div>2 required items block Design dev.<br>Warehouse has 0 free in bin L-08.<br>Sep 12 · in 8 days<br>Needs attention</div>
<div class="not"><div class="lbl">Not</div>Validation errors detected.<br>Insufficient inventory.<br>09/12/2026<br>Action required</div>
</div></body></html>
