<!-- @dsCard group="Type" viewport="700x200" name="Weights" subtitle="Helvetica Neue LT Std, self-hosted. Every word is Roman 400; the other cuts are wired, not used." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Weights</title><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;box-sizing:border-box;display:grid;grid-template-columns:repeat(5,1fr);gap:12px 16px}
div{font-family:var(--font-helveticaneue);color:var(--text-muted)}
.on{color:var(--text-primary)}
span{display:block;margin-top:4px;font-size:12px;line-height:16px;letter-spacing:.132px;font-weight:400;font-style:normal;color:var(--text-muted)}
.on span{color:var(--text-primary)}
.g{font-size:48px;line-height:1;letter-spacing:.528px}
</style></head><body>
<div style="font-weight:200"><div class="g">Aa</div><span>Ultra Light 200</span></div>
<div style="font-weight:300"><div class="g">Aa</div><span>Light 300</span></div>
<div class="on" style="font-weight:400"><div class="g">Aa</div><span>Roman 400 · in use</span></div>
<div style="font-weight:500"><div class="g">Aa</div><span>Medium 500</span></div>
<div style="font-weight:700"><div class="g">Aa</div><span>Bold 700</span></div>
<div style="font-weight:200;font-style:italic"><div class="g">Aa</div><span>Ultra Light It</span></div>
<div style="font-weight:300;font-style:italic"><div class="g">Aa</div><span>Light It</span></div>
<div style="font-weight:400;font-style:italic"><div class="g">Aa</div><span>Italic</span></div>
<div style="font-weight:500;font-style:italic"><div class="g">Aa</div><span>Medium It</span></div>
<div style="font-weight:700;font-style:italic"><div class="g">Aa</div><span>Bold It</span></div>
</body></html>
