<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="Lowercase, trailing underscore — set in type, no mark supplied" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Wordmark</title><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;box-sizing:border-box}
.row{display:flex;align-items:baseline;gap:48px}
.big{font-size:var(--text-display);line-height:var(--leading-display);letter-spacing:var(--tracking-display)}
.rail{font-size:18px;line-height:1;letter-spacing:.198px}
.lbl{margin-top:24px;font-size:13px;line-height:16px;letter-spacing:.143px;color:var(--text-muted)}
</style></head><body>
<div class="row"><span class="big">enkel_</span><span class="rail">switchyards_</span></div>
<div class="lbl">The product name in lowercase HelveticaNeue 400, 18px at the top of the rail. The underscore is non-negotiable.</div>
</body></html>
