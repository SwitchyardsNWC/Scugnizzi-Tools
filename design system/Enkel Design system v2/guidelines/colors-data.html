<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:4px}.chip{height:40px}.lbl{font-size:13px;letter-spacing:.143px}.mut{color:var(--text-muted);font-family:var(--font-mono);font-size:12px;letter-spacing:0}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--data-1)"></div><div class="lbl">Series 1 · primary</div><div class="lbl mut">#4a5fa5</div></div><div class="sw"><div class="chip" style="background:var(--data-2)"></div><div class="lbl">2 · revenue / good</div><div class="lbl mut">#5b8a5e</div></div><div class="sw"><div class="chip" style="background:var(--data-3)"></div><div class="lbl">3 · warn</div><div class="lbl mut">#c48a2e</div></div><div class="sw"><div class="chip" style="background:var(--data-4)"></div><div class="lbl">4 · bad</div><div class="lbl mut">#b8412b</div></div><div class="sw"><div class="chip" style="background:var(--data-5)"></div><div class="lbl">5 · neutral</div><div class="lbl mut">#7a7d79</div></div><div class="sw"><div class="chip" style="background:var(--data-6)"></div><div class="lbl">6 · secondary</div><div class="lbl mut">#3e7d7a</div></div></div><div class="row" style="margin-top:12px;align-items:center"><span class="lbl" style="color:var(--delta-up);font-family:var(--font-mono)">▲ +4.2%</span><span class="lbl" style="color:var(--delta-down);font-family:var(--font-mono)">▼ −2.6%</span><span class="lbl" style="color:var(--delta-flat);font-family:var(--font-mono)">■ 0.0%</span><span class="lbl" style="color:var(--text-muted)">Track: --data-track. Series 1 is always the default bar / line; 3 and 4 flag rows, never decorate.</span></div></body></html>
