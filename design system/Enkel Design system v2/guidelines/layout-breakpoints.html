<!-- @dsCard group="Spacing" viewport="700x200" name="Breakpoints" subtitle="Three tiers · rail collapses below 768 · gutters 16 / 24 / 24–32 · content max 1440" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Breakpoints</title><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1.6fr 2.4fr;gap:16px;align-items:end;font-size:13px;line-height:16px;letter-spacing:.143px}
/* Structure is ink (rail, header, bars); the content lines inside are soft. */
.t{border:1px solid var(--border-hairline);height:110px;display:grid;box-sizing:border-box;background:var(--surface-sunken)}
.rail{border-right:1px solid var(--border-hairline);background:var(--surface-paper)}
.bar{background:var(--surface-paper)}
.c{border-top:1px solid var(--border-card);margin:8px 0}
.l{margin-top:8px;color:var(--text-primary)}
.m{margin-top:2px;color:var(--text-muted)}
</style></head><body>
<div><div class="t" style="grid-template-rows:14px 1fr 16px"><div class="bar" style="border-bottom:1px solid var(--border-hairline)"></div><div style="padding:0 6px"><div class="c"></div><div class="c"></div></div><div class="bar" style="border-top:1px solid var(--border-hairline)"></div></div><div class="l">Phone &lt;768</div><div class="m">no rail · 16 gutter</div></div>
<div><div class="t" style="grid-template-columns:36px 1fr"><div class="rail"></div><div style="padding:0 9px"><div class="c"></div><div class="c"></div></div></div><div class="l">Tablet 768–1023</div><div class="m">160 rail · 24 gutter</div></div>
<div><div class="t" style="grid-template-columns:44px 1fr"><div class="rail"></div><div style="padding:0 25% 0 9px"><div class="c"></div><div class="c"></div></div></div><div class="l">Desktop ≥1024</div><div class="m">200 rail · 24 / 32 gutter · 1440 max</div></div>
</body></html>
