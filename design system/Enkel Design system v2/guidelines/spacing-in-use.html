<!-- @dsCard group="Spacing" viewport="700x220" name="In use" subtitle="16px card padding, 12px between cards, 8px between list rows, soft hairlines inside" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing in use</title><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;box-sizing:border-box;background:var(--surface-sunken);font-size:13px;line-height:16px;letter-spacing:.143px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface-card);border:1px solid var(--border-card);padding:16px;display:flex;flex-direction:column;min-width:0}
.t{color:var(--text-secondary)}
.v{margin:8px 0 12px;font-family:var(--font-mono);font-size:28px;line-height:1.1;letter-spacing:-.2px}
.r{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--border-muted)}
.r span:last-child{font-family:var(--font-mono);letter-spacing:0;color:var(--text-muted)}
.note{margin-top:12px;color:var(--text-muted)}
.note b{font-weight:400;font-family:var(--font-mono);letter-spacing:0;color:var(--text-primary)}
</style></head><body>
<div class="grid">
<div class="card"><span class="t">Occupancy by club</span><span class="v">78 %</span><div class="r"><span>Brooklyn</span><span>91 %</span></div><div class="r"><span>Queens</span><span>64 %</span></div></div>
<div class="card"><span class="t">Open items</span><span class="v">14</span><div class="r"><span>Blocked</span><span>3</span></div><div class="r"><span>At risk</span><span>5</span></div></div>
</div>
<div class="note"><b>16</b> inside a card · <b>12</b> between cards · <b>8</b> under a title · <b>32</b> between sections · <b>24</b> page gutter</div>
</body></html>
