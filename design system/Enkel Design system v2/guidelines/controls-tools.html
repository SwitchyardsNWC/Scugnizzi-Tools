<!-- @dsCard group="Spacing" viewport="1840x1248" name="Tool controls" subtitle="The tool layer: a paper panel of 28px controls, a sunken stage, one export bar. Light and dark side by side." -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Tool controls</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../tools.css"><style>
/* The specimen: one whole tool per theme, side by side. Everything below is tools.css; this block only lays the two out. */
html,body{height:auto}
body{background:var(--surface-sunken)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-height:100vh}
.side{display:grid;grid-template-columns:var(--tool-panel-width) minmax(0,1fr);min-width:0;background:var(--surface-sunken);color:var(--text-primary)}
.side + .side{border-left:var(--border-width) solid var(--border-hairline)}
.side aside{overflow:visible}
.side main{min-height:0}
.side .stage{min-height:200px}
/* The work: a print on its paper. Its colours are the picture's, not the chrome's, so they stay put in both themes. */
.art{width:180px;height:128px;background:#f6f2e8;color:#0078bf;display:grid;place-items:center;font:32px/1 Georgia,serif}
.notes{padding:var(--spacing-16);border-top:var(--border-width) solid var(--border-card);background:var(--surface-paper);
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--spacing-16) var(--spacing-24);font-size:var(--text-caption);line-height:16px;letter-spacing:var(--tracking-caption);color:var(--text-muted)}
.notes h2{margin:0 0 var(--spacing-8);font-size:var(--text-micro);line-height:var(--leading-micro);letter-spacing:var(--tracking-micro);text-transform:uppercase;color:var(--text-muted)}
.notes dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.notes dt{font-family:var(--font-mono);letter-spacing:0;color:var(--text-primary)}
.notes dd{margin:0}
.notes p{margin:0 0 var(--spacing-8)}
</style></head><body>
<div class="pair">
<template id="tool">
  <aside>
    <h1>Riso separator</h1>
    <p class="sub">Split a picture into two or three Riso inks.</p>
    <details class="panel" open>
      <summary><span class="t">Image</span><span class="v">sample · 900 × 640</span></summary>
      <div class="body">
        <div class="drop"><b>Drop an image here</b>or click to choose <kbd>O</kbd></div>
        <p class="hint">Open now <span class="tag">sample-chair.webp</span>. Photos and flat graphics both work.</p>
      </div>
    </details>
    <details class="panel" open>
      <summary><span class="t">Presets</span><span class="v">Pink &amp; blue</span></summary>
      <div class="body">
        <div class="presets"><button class="on">Pink &amp; blue<small>two drums, dots</small></button><button>Zine grain<small>orange on kraft</small></button></div>
        <div class="row"><input type="text" placeholder="Name this look…" aria-label="Name for the new preset"><button>Save preset</button></div>
        <div class="btn-row"><button class="danger">Reset to defaults</button></div>
      </div>
    </details>
    <details class="panel" open>
      <summary><span class="t">Inks</span><span class="v">Blue + Pink</span></summary>
      <div class="body">
        <div class="list">
          <div class="item on" tabindex="0"><span class="sq" style="color:#0078bf"></span><span class="name">1 · Blue</span><span class="meta">dot 15°</span><button class="icon danger" title="Remove ink 1" aria-label="Remove ink 1">×</button></div>
          <div class="item" tabindex="0"><span class="sq" style="color:#ff48b0"></span><span class="name">2 · Fluorescent pink</span><span class="meta">dot 75°</span><button class="icon danger" title="Remove ink 2" aria-label="Remove ink 2">×</button></div>
        </div>
        <div class="addrow"><button>+ Ink</button><button class="danger">Remove ink 1</button></div>
        <div class="row"><label>Colour</label><input type="color" value="#0078bf" aria-label="Custom ink colour"><span class="hex">#0078bf · Blue</span></div>
        <h3>Separation</h3>
        <div class="row"><label>Pulls from</label><select aria-label="Pulls from"><option>Darkness (1 − luminance)</option></select></div>
        <div class="row"><span class="lab">Pattern</span><div class="seg"><button class="on">Dot</button><button>Line</button><button>Grain</button></div></div>
        <div class="slider"><label>Contrast</label><output>1.25×</output><input type="range" min="0" max="2" step=".05" value="1.25" aria-label="Contrast"></div>
        <label class="check"><input type="checkbox" checked><span>Invert<small>Swap the inked and the bare parts.</small></span></label>
      </div>
    </details>
    <details class="panel" open>
      <summary><span class="t">Press</span><span class="v">Natural · 2 px</span></summary>
      <div class="body">
        <div class="presets wide"><button class="on">Natural<small>Warm off-white, the house stock.</small></button><button>Kraft<small>Brown and toothy; pale inks sink.</small></button></div>
        <div class="row"><label>Misregister</label><input type="number" value="2" aria-label="Misregister"><span class="hint">px</span></div>
        <div class="row"><label>Seed</label><input type="number" value="1" aria-label="Seed"><button>Reshuffle</button></div>
        <p class="row-note">Drives grain and registration.</p>
        <label class="check"><input type="checkbox" class="switch"><span>Grain</span></label>
      </div>
    </details>
    <details class="panel"><summary><span class="t">Randomness</span><span class="v">closed</span></summary><div class="body"></div></details>
  </aside>
  <main>
    <div class="topbar"><span>900 × 640 px · sample · 189 ms</span><span class="spacer"></span>
      <div class="seg inline"><button class="on">Print</button><button>Separations</button></div>
      <label>Zoom <select aria-label="Zoom"><option>Fit · 71%</option></select></label></div>
    <div class="stage"><div class="art work">riso</div></div>
    <div class="footer">
      <div class="actions"><button class="primary">Download print</button><button>Download separations</button><button>Copy image</button><button>Copy recipe</button></div>
      <pre class="recipe">Riso print of sample (900 × 640 px) on #f6f2e8 paper, 30% grain, 50% ink soak.
Ink 1 Blue (#0078bf) from darkness: dot 15°, contrast 1.25×.
Ink 2 Fluorescent pink (#ff48b0) from shadows: dot 75°.
Misregistered 2 px, seed 1.</pre>
    </div>
    <div class="notes">
      <div>
        <h2>Geometry</h2>
        <dl>
          <dt>28</dt><dd>button, field, select, segmented: 1 + 8 / 14 / 4 + 1</dd>
          <dt>24</dt><dd>icon button, banner controls</dd>
          <dt>40</dt><dd>section header, the bar over the stage</dd>
          <dt>14</dt><dd>check and radio, square</dd>
          <dt>12</dt><dd>slider thumb, square, on a 2px track</dd>
          <dt>320</dt><dd>side panel; the list rail 280</dd>
          <dt>160</dt><dd>an export column, two of them</dd>
          <dt>100</dt><dd>the export bar: three rows of 28, 8 between</dd>
        </dl>
      </div>
      <div>
        <h2>Export bar</h2>
        <p>The same in every tool: the action that finishes the job across both columns, the rest in pairs, Copy recipe last. The recipe sits beside them at their height and scrolls inside it.</p>
        <h2>Selection</h2>
        <p>Chosen is ink: a filled segment, a 2px marker down a row, a 2px ink edge and a square mark on a preset. Lightness and shape carry it; colour never does on its own. Brick is for what destroys, and the label says what.</p>
      </div>
    </div>
  </main>
</template>
<div class="side" data-theme="light"></div>
<div class="side" data-theme="dark"></div>
</div>
<script>
for (const side of document.querySelectorAll('.side')) side.appendChild(document.getElementById('tool').content.cloneNode(true));
/* The light half stays light when the page around it goes dark: it takes :root's own values, read from the sheets. */
function pinLight(el) {
  const walk = (sheet) => {
    let rules; try { rules = sheet.cssRules; } catch (e) { return; } /* a cross-origin sheet (the Google fonts) has none to read */
    for (const r of rules) {
      if (r.styleSheet) walk(r.styleSheet);
      else if (r.selectorText && /^:root\b/.test(r.selectorText)) for (const p of r.style) if (p.startsWith('--') || p === 'color-scheme') el.style.setProperty(p, r.style.getPropertyValue(p));
    }
  };
  for (const s of document.styleSheets) walk(s);
}
pinLight(document.querySelector('.side[data-theme="light"]'));
addEventListener('load', () => pinLight(document.querySelector('.side[data-theme="light"]')));
</script>
</body></html>
