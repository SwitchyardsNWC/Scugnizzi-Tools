<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUB-MOD</title>
<meta name="theme-color" content="#151515">
<script src="../theme.js"></script>
<link rel="stylesheet" href="../design system/Enkel Design system v2/styles.css">
<link rel="stylesheet" href="../design system/Enkel Design system v2/tools.css">
<style>
  /* HUB-MOD: only what is particular to this tool. The panel, panes, rows, fields, buttons, segments, checks, the module
     list and the stage are tools.css on the Enkel tokens. The email in the preview frame is the work, not chrome: the
     paper behind it, its grounds, and the selection drawn over it inside the frame stay as the compiler makes them. */

  /* --- the frame: a rail of modules and parts, the work, the inspector ------------------------------------------------ */
  .app{grid-template-columns:var(--tool-rail-width) minmax(0,1fr) var(--tool-panel-width)}
  .app>aside{padding:0}                                   /* both panels are stacks of .pane, which carry their own inset */
  .pane:not(.intro)>:last-child{margin-bottom:0}       /* the title block keeps tools.css's 20 under its line */
  .pane-head+.hint{margin-top:0}
  .grow{flex:1}
  /* The caps title and its count or state share a baseline: centred (tools.css), a mono count sits 1.4px low. A 14px line
     for all three keeps the head on whole pixels (16), where 1.2 of 11 and of 12 left everything under it on fractions. */
  /* The title block is tools.css's (.panel-title, .panel-sub): the pane only keeps the panel's sides and its rule. */
  .intro{padding-top:0;padding-bottom:0}

  /* --- modules ------------------------------------------------------------------------------------------------------- */
  .lib .item{width:100%;text-align:left}                 /* a <button>: its words start at the left like any list row */

  /* --- parts: the outline ------------------------------------------------------------------------------------------- */
  #outline>div,.nest{display:flex;flex-direction:column;gap:2px}
  .orow{display:flex;align-items:center;gap:var(--spacing-8);min-height:32px;padding:0 var(--spacing-4);cursor:pointer;position:relative;
    border:var(--border-width) solid transparent;border-radius:var(--radius-controls);
    transition:background-color var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard)}
  .orow:hover{background:var(--surface-row-hover);border-color:var(--border-card)}
  /* Selected: the selection surface, an ink edge and a 2px ink marker down the left, as on every list in the suite. */
  .orow.on{background:var(--surface-selected);border-color:var(--text-primary);box-shadow:inset 2px 0 0 var(--text-primary)}
  .orow:focus-visible{outline-offset:1px}               /* the ring sits in the 2px between rows */
  .orow .ttl{flex:1;min-width:0;padding-top:var(--optical-nudge);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .orow .tag{flex:none}
  .auto,.issue .lv{flex:none;min-height:18px;padding-top:1px}
  .orow .acts{display:none;flex:none}
  .orow:hover .acts,.orow.on .acts{display:flex}
  .orow:hover .tag,.orow.on .tag{display:none}          /* the glyph keeps saying field or fixed while the buttons show */
  .orow.dragging{opacity:.5}
  .orow.drop-before{box-shadow:inset 0 2px 0 var(--text-primary)}
  .orow.drop-after{box-shadow:inset 0 -2px 0 var(--text-primary)}
  .orow.on.drop-before{box-shadow:inset 2px 0 0 var(--text-primary),inset 0 2px 0 var(--text-primary)}
  .orow.on.drop-after{box-shadow:inset 2px 0 0 var(--text-primary),inset 0 -2px 0 var(--text-primary)}
  /* A part's type in a small square. Its edge says what the team gets, like the tag beside it: solid ink, a field they
     edit; dashed, fixed; dotted, a container that holds parts. Shape carries it, so it reads without colour. */
  /* Boxed mono at 11 in an 18 box: 1 + 1 / 14 / 2 + 1 puts its caps on the box's middle and its baseline on the row's. */
  .glyph{flex:0 0 24px;width:24px;height:18px;padding-top:1px;overflow:hidden;text-align:center;white-space:nowrap;
    font-family:var(--font-mono-detail);font-size:var(--text-micro);line-height:14px;letter-spacing:0;color:var(--text-muted);
    border:var(--border-width) solid var(--border-card);border-radius:var(--radius-tags-sm)}
  .glyph.field{border-color:var(--text-secondary);color:var(--text-primary)}
  .glyph.fixed{border-style:dashed;border-color:var(--border-control)}
  .glyph.group{border-style:dotted;border-color:var(--border-control)}   /* a container: dotted, so all three kinds have a drawn edge */
  .tag.field{border-color:var(--text-secondary);color:var(--text-primary)}
  .tag.fixed{border-style:dashed;border-color:var(--border-control)}
  .ohead{display:flex;align-items:center;gap:var(--spacing-8);padding:var(--spacing-8) var(--spacing-4) 2px;
    font-family:var(--font-mono-detail);font-size:var(--text-micro);line-height:14px;letter-spacing:0;color:var(--text-muted)}
  .ohead .grow{border-top:var(--border-width) solid var(--border-muted)}
  .nest{margin-left:var(--spacing-12);padding-left:var(--spacing-8);border-left:var(--border-width) solid var(--border-card)}
  .nest>.nest{margin-left:0;padding-left:0;border-left:0}   /* a column's list sits under its own head, not indented twice */
  .oadd{align-self:flex-start;margin:2px 0 var(--spacing-4)}   /* '+ Part': the 28px outline every '+ Noun' in the suite is */
  /* × turns brick when you point at it, as it does on split-flap's messages (tools.css lets .icon's hover win). */
  .oempty{padding:var(--spacing-4) var(--spacing-8);font-size:var(--text-caption);line-height:16px;color:var(--text-muted)}
  .oempty.drop-in{color:var(--text-primary);background:var(--surface-row-hover);outline:var(--border-width) dashed var(--text-primary);outline-offset:-1px}

  /* --- checks -------------------------------------------------------------------------------------------------------- */
  .issues{display:flex;flex-direction:column;gap:var(--spacing-8)}
  .issue{width:100%;min-height:0;justify-content:flex-start;align-items:baseline;gap:var(--spacing-8);padding:var(--spacing-8);
    text-align:left;white-space:normal;font-size:var(--text-caption);line-height:16px;letter-spacing:var(--tracking-caption);border-color:var(--border-card)}
  .issue>span:last-child{flex:1;min-width:0}
  /* Error and warning differ three ways: the word, a filled or an outlined badge, a solid or a dashed edge. */
  .issue.error,.issue.error:hover{border-color:var(--status-blocked)}
  .issue.warning{border-style:dashed;border-color:var(--border-control)}
  /* The badge and the 'auto' chip are tags: .tag's 5px sides and its radius. */
  .issue .lv{padding-left:5px;padding-right:5px;font-family:var(--font-mono-detail);font-size:var(--text-micro);line-height:14px;letter-spacing:0;
    border:var(--border-width) solid currentColor;border-radius:var(--radius-tags-sm)}
  .issue.error .lv{color:var(--surface-paper);background:var(--status-blocked);border-color:var(--status-blocked)}
  .issue.warning .lv{color:var(--status-risk)}
  .ok{font-size:var(--text-caption);line-height:16px;color:var(--text-muted)}
  .sys{font-family:var(--font-mono-detail);font-size:var(--text-micro);line-height:16px;letter-spacing:0;color:var(--text-muted);overflow-wrap:anywhere}
  .sys .path{word-break:break-all}   /* a path fills each line instead of breaking at its hyphens: two lines, not three */

  /* --- the bars over the stage --------------------------------------------------------------------------------------- */
  /* The views are navigation, so they look like it: words on the bar, the open one in ink over a 2px ink rule that sits
     on the bar's own edge. The preview's settings below are segments, a different thing that looks different. */
  .tabs{display:flex;align-self:stretch;gap:var(--spacing-16);margin:0 0 -1px calc(var(--spacing-4) * -1)}
  /* 39 = 13 / 16 / 10 at the panel's 13px: with the bar's 1px top it fills the 40px bar and stands on its edge (the -1px
     margin), so the ink rule under the open view replaces the bar's hairline and the bar stays 40. */
  .topbar .tabs button{min-height:0;padding:13px 4px 10px;font-size:var(--text-meta);line-height:16px;letter-spacing:var(--tracking-meta);
    color:var(--text-muted);background:transparent;border:0;border-radius:0}
  .topbar .tabs button:hover{color:var(--text-primary);background:transparent}
  .topbar .tabs button[aria-selected="true"]{color:var(--text-primary);box-shadow:inset 0 -2px 0 var(--text-primary);cursor:default}
  .topbar .tabs button:focus-visible{outline-offset:-2px}
  /* Why the download is off, on the recipe's first line: the words say it, brick ties it to the errors under Checks. */
  #zipNote{color:var(--status-blocked)}
  /* 5 + 28 + 6 + 1 = 40: the 28px segments in the 40px bar, the odd pixel under them. A wrapped line keeps the rhythm:
     28 tall, 8 apart. */
  .subbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:var(--spacing-8) var(--spacing-16);min-height:var(--tool-bar-height);
    padding:5px var(--spacing-16) 6px;background:var(--surface-paper);border-bottom:var(--border-width) solid var(--border-card)}
  .vgroup{display:inline-flex;align-items:baseline;gap:var(--spacing-8);min-width:0}
  .vgroup>.lab{font-size:var(--text-caption);letter-spacing:var(--tracking-caption);color:var(--text-muted);white-space:nowrap}
  .subbar .seg.inline button{padding-left:var(--spacing-8);padding-right:var(--spacing-8)}
  /* The theme's own ground beside its name. Both sit on the words' baseline, so the button's baseline is the words' (an
     empty box first would put it at the box's foot) and the chip stands at cap height. */
  .seg .swatch{margin:0}
  #themeSeg button>*{align-self:baseline}

  /* --- the stage ----------------------------------------------------------------------------------------------------- */
  .stage{display:block;padding:0}
  .canvas{display:flex;padding:var(--spacing-24) var(--spacing-16) var(--spacing-32)}
  .canvas>div{margin:0 auto}                              /* centred while it fits, from the left when it does not */
  .device{margin:0 auto;background:#fff}                 /* the paper behind the email: content; its ring is tools.css's .work */
  .device iframe{display:block;width:100%;height:200px;border:0}
  .device-note{margin:var(--spacing-8) 0 0;text-align:center;font-family:var(--font-mono-detail);font-size:var(--text-caption);line-height:16px;letter-spacing:0;color:var(--text-muted)}
  .dark-note{max-width:600px;margin:0 auto var(--spacing-12);padding:var(--spacing-8) var(--spacing-12);font-size:var(--text-caption);line-height:16px;letter-spacing:var(--tracking-caption);
    color:var(--text-secondary);background:var(--surface-paper);border:var(--border-width) solid var(--border-card)}
  .dark-note .mono{font-family:var(--font-mono-detail);font-size:var(--text-micro);line-height:14px}   /* see .hint .mono */

  /* --- code ---------------------------------------------------------------------------------------------------------- */
  .code{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);height:100%}
  .files{display:flex;flex-direction:column;gap:2px;min-height:0;overflow-y:auto;padding:var(--spacing-12) var(--spacing-8);
    background:var(--surface-paper);border-right:var(--border-width) solid var(--border-card)}
  .files button{width:100%;justify-content:space-between;padding-left:var(--spacing-8);padding-right:var(--spacing-8);border-color:transparent;
    font-family:var(--font-mono-detail);font-size:var(--text-caption);letter-spacing:0}
  .files button:hover{border-color:var(--border-card)}
  .files button.on,.files button.on:hover{background:var(--surface-selected);border-color:var(--text-primary);box-shadow:inset 2px 0 0 var(--text-primary)}
  .files .sz{color:var(--text-muted)}
  .files .sep{margin:var(--spacing-8) var(--spacing-4);border-top:var(--border-width) solid var(--border-muted)}
  .files .hint{margin:0;padding:0 var(--spacing-8)}
  /* The folder and its size, a 16 px blank line, then why there are three files: 16 less the list's 2 px gap keeps the
     second hint where the old blank line put it. */
  .files .hint+.hint{margin-top:calc(var(--spacing-16) - 2px)}
  /* 11px mono in a 16px line of 12px words: at the line's own 16 its taller ascent grows the line to 17 (measured), so a
     two-line hint was 33 and a list of them stepped 19. At 14 it stays inside the line and on its baseline. */
  .hint .mono{font-family:var(--font-mono-detail);font-size:var(--text-micro);line-height:14px}
  .codepane{display:flex;flex-direction:column;min-width:0;min-height:0}
  /* 40 = 1 + 38 + the edge, as tools.css's topbar: the top pixel keeps the centred 28 on whole pixels (it sat at .5). */
  .codehead{flex:none;display:flex;align-items:center;gap:var(--spacing-8);min-height:var(--tool-bar-height);padding:1px var(--spacing-8) 0 var(--spacing-16);
    background:var(--surface-paper);border-bottom:var(--border-width) solid var(--border-card)}
  .codehead .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--font-mono-detail);font-size:var(--text-caption);letter-spacing:0;color:var(--text-muted)}
  pre.src{flex:1;min-height:0;margin:0;padding:var(--spacing-12) var(--spacing-16) var(--spacing-32) 0;overflow:auto;white-space:pre;tab-size:2;counter-reset:ln;
    font-family:var(--font-mono-detail);font-size:var(--text-caption);line-height:18px;letter-spacing:0;color:var(--text-secondary)}
  pre.src .ln{display:block}
  pre.src .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:40px;margin-right:var(--spacing-16);text-align:right;color:var(--text-muted);user-select:none}
  /* HubL stands out by lightness and a fill, comments by tone and slant: no hue, so it reads for every eye. */
  .hubl{color:var(--text-primary);background:var(--surface-selected)}
  .cmt{color:var(--text-muted);font-style:italic}

  /* --- hand build ---------------------------------------------------------------------------------------------------- */
  .steps{max-width:880px;margin:0 auto;padding:var(--spacing-24) var(--spacing-32) var(--spacing-32)}
  .steps h2{margin:var(--spacing-32) 0 var(--spacing-8);font-size:var(--text-subheading);line-height:20px;letter-spacing:var(--tracking-subheading);color:var(--text-primary)}
  .steps h2:first-child{margin-top:0}
  .steps p{max-width:72ch;margin:var(--spacing-8) 0;line-height:20px;color:var(--text-secondary)}
  .steps p.hint{margin:var(--spacing-16) 0 var(--spacing-4);line-height:16px;color:var(--text-muted)}
  .steps ol{max-width:72ch;margin:var(--spacing-8) 0;padding-left:var(--spacing-24);color:var(--text-secondary)}
  .steps li{margin:var(--spacing-4) 0;line-height:20px}
  .steps b{font-weight:400;color:var(--text-primary)}
  .steps code{padding:1px 4px 0;font-family:var(--font-mono-detail);font-size:var(--text-caption);letter-spacing:0;color:var(--text-primary);
    background:var(--surface-card);border:var(--border-width) solid var(--border-card);border-radius:var(--radius-tags-sm)}
  .steps a{color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--border-control);text-underline-offset:3px}
  .steps a:hover{text-decoration-color:var(--text-primary)}
  .cmd{display:flex;align-items:center;gap:var(--spacing-8);margin:var(--spacing-8) 0 var(--spacing-4);padding:var(--spacing-4) var(--spacing-4) var(--spacing-4) var(--spacing-12);
    background:var(--surface-card);border:var(--border-width) solid var(--border-card)}
  .cmd code{flex:1;min-width:0;padding:1px 0 0;background:none;border:0;white-space:pre-wrap;word-break:break-all}
  .steps .cmd+.hint{margin:0 0 var(--spacing-12)}
  .ftable{width:100%;margin:var(--spacing-12) 0;border-collapse:collapse;font-size:var(--text-meta);line-height:18px}
  .ftable th{padding:var(--spacing-8) var(--spacing-8) var(--spacing-4);text-align:left;font-weight:400;font-size:var(--text-micro);line-height:14px;letter-spacing:var(--tracking-micro);
    text-transform:uppercase;color:var(--text-muted);border-bottom:var(--border-width) solid var(--border-hairline)}
  .ftable td{padding:var(--spacing-8);vertical-align:top;color:var(--text-primary);border-bottom:var(--border-width) solid var(--border-muted)}
  .ftable td code{white-space:nowrap}
  .ftable td.ck{width:36px;padding:0}
  /* The whole cell ticks. 10 = 8 + (18 − 14) / 2: the box on the middle of the row's first 18px line. */
  .ftable td.ck label{display:flex;justify-content:center;padding:10px var(--spacing-8) var(--spacing-8);cursor:pointer}
  .ftable tr.child td:nth-child(2){padding-left:var(--spacing-24)}
  .ftable tr.child td:nth-child(2)::before{content:"↳ ";color:var(--text-muted)}
  .ftable tr.done td{color:var(--text-muted);text-decoration:line-through}
  .ftable tr.done td.ck{text-decoration:none}

  /* --- inspector ----------------------------------------------------------------------------------------------------- */
  /* Beside the stage its rule continues the bars' (--bars-h is theirs, kept by syncBars); elsewhere it is 56. */
  .insp-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--spacing-8);min-height:56px;padding:var(--spacing-8) var(--spacing-12) var(--spacing-8) var(--panel-pad);
    background:var(--surface-paper);border-bottom:var(--border-width) solid var(--border-card)}
  .insp-head .t{flex:1;min-width:0}
  .insp-head .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;font-size:var(--text-body);line-height:18px;letter-spacing:var(--tracking-body);color:var(--text-primary)}
  .insp-head .t .in{font-style:normal;color:var(--text-muted)}
  .insp-head .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--font-mono-detail);font-size:var(--text-caption);line-height:16px;letter-spacing:0;color:var(--text-muted)}
  .insp-head .t span.prose{font-family:var(--font-helveticaneue);letter-spacing:var(--tracking-caption)}   /* words, not a path */
  .insp-head .acts{display:flex;flex:none}
  .insp-head .acts [data-act="del"]{margin-left:var(--spacing-4)}   /* the one that destroys stands a step apart */
  .row>.ctl>select,.row>.ctl>input[type=text],.row>.ctl>input[type=url]{flex:1;min-width:0}
  .row>.ctl>.hint{margin:0;padding-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .namefield{display:flex;align-items:center;gap:var(--spacing-8)}
  /* A HubL name is code, so it stays mono; 6 / 6 instead of 8 / 4 lifts the 12px mono onto the 'auto' tag's baseline. */
  .namefield input{flex:1;padding-top:6px;padding-bottom:6px;font-family:var(--font-mono-detail);font-size:var(--text-caption);letter-spacing:0}
  .hint.mono{font-family:var(--font-mono-detail);font-size:var(--text-micro);overflow-wrap:anywhere}
  .auto{padding-left:5px;padding-right:5px;font-family:var(--font-mono-detail);font-size:var(--text-micro);line-height:14px;letter-spacing:0;white-space:nowrap;
    color:var(--text-muted);border:var(--border-width) dashed var(--border-control);border-radius:var(--radius-tags-sm)}
  textarea{font-family:var(--font-mono-detail);font-size:var(--text-caption);letter-spacing:0}
  ol.hint{margin:var(--spacing-8) 0 0;padding-left:var(--spacing-16)}
  ol.hint li{margin:2px 0}
  /* An 18px tag in a 16px line of words: its top stands 2px above the line, so it would push its line 2px down. The
     margin hands those 2px back and the hint keeps its 16px pitch (measured). */
  /* A theme's ground as a chip: wider than tall, so beside a checkbox it reads as a colour, not a second box. Its foot
     sits on the baseline and it is 9 tall, the 13px Helvetica Neue's cap height (any taller pushes a segment's words
     down a pixel). The hex says it for an eye that can't. */
  .swatch{display:inline-block;flex:none;width:16px;height:9px;margin:0 var(--spacing-4);vertical-align:baseline;border:var(--border-width) solid var(--border-control)}
  .items{display:flex;flex-direction:column;gap:var(--spacing-8);margin:var(--spacing-12) 0}
  .itemcard{padding:var(--spacing-4) var(--spacing-8) var(--spacing-12) var(--spacing-12);border:var(--border-width) solid var(--border-card)}
  .itemcard .ih{display:flex;align-items:center;min-height:28px;font-size:var(--text-caption);letter-spacing:var(--tracking-caption);color:var(--text-secondary)}
  .itemcard .ih>span:first-child{padding-top:var(--optical-nudge)}
  .itemcard .ih [data-item-act="del"]{margin-left:var(--spacing-4)}
  .itemcard .stack{margin:var(--spacing-8) var(--spacing-4) 0 0}

  /* --- the add-part and new-module menu ---------------------------------------------------------------------------- */
  .menu{position:fixed;z-index:200;min-width:240px;max-width:min(320px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow-y:auto;scrollbar-width:thin;
    padding:var(--spacing-4);background:var(--surface-card);border:var(--border-width) solid var(--border-hairline)}
  .menu button{width:100%;min-height:0;justify-content:flex-start;align-items:baseline;gap:var(--spacing-8);padding:var(--spacing-8) var(--spacing-8) var(--spacing-4);text-align:left;white-space:normal;line-height:18px;
    border:0;border-radius:2px}
  .menu button:hover,.menu button:focus-visible{background:var(--surface-row-hover)}
  .menu button:focus-visible{outline-offset:-1px}
  .menu button>span:last-child{flex:1;min-width:0}
  .menu button small{display:block;font-size:var(--text-caption);line-height:16px;letter-spacing:var(--tracking-caption);color:var(--text-muted)}
  .menu .sep{margin:var(--spacing-4) 0;border-top:var(--border-width) solid var(--border-muted)}
  .menu .mh{padding:var(--spacing-8) var(--spacing-8) var(--spacing-4);font-size:var(--text-micro);line-height:14px;letter-spacing:var(--tracking-micro);text-transform:uppercase;color:var(--text-muted)}

  /* --- narrower windows -------------------------------------------------------------------------------------------- */
  /* Three columns need 280 + 320 + the 720px desktop box + 2 × 16 = 1352. Narrower, the inspector goes under the rail:
     one column of panels, the preview at its full width beside it. The rail and the inspector get half each, and the
     rail leads with Parts and Checks (placeModules moves Modules after them), so the part you edit below stays in view. */
  /* Three columns: the inspector's head is as tall as the bars over the stage, its words centred in it, so one rule runs
     on from theirs. The rail's title block is the suite's, so its rule lines up with every other tool's panel instead. */
  @media (min-width:1352px){
    .insp-head{min-height:var(--bars-h,80px)}
  }
  @media (max-width:1351px){
    .app{grid-template-columns:var(--tool-rail-width) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"rail main" "insp main"}
    .app>aside.left{grid-area:rail}
    .app>main{grid-area:main}
    .app>aside.right{grid-area:insp;border-left:0;border-right:var(--border-width) solid var(--border-hairline);border-top:var(--border-width) solid var(--border-hairline)}
    .intro{display:none}                                  /* the banner already names the tool */
    .canvas{padding-left:var(--spacing-12);padding-right:var(--spacing-12)}
  }
  /* Below 1024 a 280 panel column would clip the email, so the work goes on top at the full width and the two panels
     sit side by side under it; the page scrolls. */
  @media (max-width:1023px){
    .app{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(480px,calc(100vh - var(--tool-banner,0px) - 160px)) auto;grid-template-areas:"main main" "rail insp";height:auto}
    /* The page scrolls, not the panels, so the inspector's head pins to the window while its long body goes by. */
    .app>aside{max-height:none;overflow:visible;border-bottom:0;border-top:var(--border-width) solid var(--border-hairline)}
    .app>aside.left{border-right:var(--border-width) solid var(--border-hairline)}
    .app>aside.right{border-left:0;border-right:0}
    /* The work's row has its own height here, so the stage fills what the bars and the export bar leave of it (tools.css
       fixes a narrow stage at 60vh, which would push the export bar over the panels under it). */
    .stage{flex:1 1 auto;height:auto}
  }
  @media (max-width:640px){
    /* On a phone the bars wrap and the export bar stacks, so the work's row grows to hold them and the email keeps 60vh. */
    .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"main" "rail" "insp"}
    .stage{flex:none;height:60vh}
    .app>aside.left{border-right:0}
    .code{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .files{max-height:160px;border-right:0;border-bottom:var(--border-width) solid var(--border-card)}
  }
</style>
</head>
<body>
<script src="../tool-banner.js" data-tool="HUB-MOD"></script>
<script src="../tool-kit.js"></script>
<script src="compile.js"></script>

<div class="app">
  <aside class="left" aria-label="Modules and parts">
    <div class="pane intro">
      <h1 class="panel-title">HUB-MOD</h1>
      <p class="panel-sub">HubSpot custom email modules on the Switchyards system.</p>
    </div>
    <div class="pane" id="paneModules">
      <div class="pane-head"><span class="t">Modules</span><span class="n" id="libCount"></span></div>
      <div class="lib list" id="lib"></div>
      <div class="btn-row">
        <button type="button" id="btnNew" aria-haspopup="menu" aria-expanded="false" title="Start a module from a Switchyards starter or a blank one (N)">+ Module…</button>
        <button type="button" id="btnOpenFile" title="Open a .hubmod.json design someone sent you">Open design…</button>
        <input type="file" id="fileIn" accept=".json,.hubmod.json,application/json" hidden>
      </div>
      <div class="btn-row">
        <button type="button" id="btnDup" title="Copy this module">Duplicate</button>
        <button type="button" id="btnDel" class="danger" title="Delete this module. ⌘Z brings it back">Delete module</button>
      </div>
    </div>
    <div class="pane" id="paneParts">
      <div class="pane-head"><span class="t">Parts</span><span class="v" id="fieldCount"></span></div>
      <div class="outline" id="outline"></div>
    </div>
    <div class="pane">
      <div class="pane-head"><span class="t">Checks</span><span class="v" id="checkCount"></span></div>
      <div class="issues" id="issues"></div>
    </div>
    <div class="pane" id="paneSys"><div class="sys" id="sysNote"></div></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="tabs" id="tabs" role="tablist" aria-label="View">
        <button type="button" role="tab" id="tabDesign" aria-controls="designBar viewDesign" data-tab="design" title="The module as the email shows it (D)">Design</button>
        <button type="button" role="tab" id="tabCode" aria-controls="viewCode" data-tab="code" title="The files HubSpot gets (C)">Code</button>
        <button type="button" role="tab" id="tabSteps" aria-controls="viewSteps" data-tab="steps" title="Building it by hand in Design Manager, field by field (B)">Hand build</button>
      </div>
    </div>
    <div class="subbar" id="designBar" role="group" aria-label="Design preview settings">
      <span class="vgroup"><span class="lab" id="labDevice">Device</span>
        <span class="seg inline" id="device" role="group" aria-labelledby="labDevice">
          <button type="button" data-device="desktop" title="Desktop width (P)">Desktop</button>
          <button type="button" data-device="phone" title="A 375 px phone; the mobile rules apply (P)">Phone</button>
        </span></span>
      <span class="vgroup"><span class="lab" id="labContent">Fields</span>
        <span class="seg inline" id="content" role="group" aria-labelledby="labContent">
          <button type="button" data-content="filled" title="Every field holds its default (E)">Filled</button>
          <button type="button" data-content="empty" title="Fields that hide when empty are blank, so you can see what collapses (E)">Empty</button>
        </span></span>
      <span class="vgroup"><span class="lab" id="labClient">Client</span>
        <span class="seg inline" id="clientSeg" role="group" aria-labelledby="labClient">
          <button type="button" data-client="all" title="A client that keeps the module's style block: Apple Mail, iOS Mail, Outlook.com (G)">Style block on</button>
          <button type="button" data-client="gmail" title="Gmail strips a style block in the body. What is inline still holds, and rich text keeps its rules if HubSpot inlines them at send: one test send has to confirm it (G)">Gmail</button>
        </span></span>
      <span class="vgroup"><span class="lab" id="labDark">Email dark mode</span>
        <span class="seg inline" id="darkSeg" role="group" aria-labelledby="labDark">
          <button type="button" data-dark="0" title="The email as a reader in light mode sees it (K)">Off</button>
          <button type="button" data-dark="1" title="Applies this module's dark-mode layer unconditionally (K)">On</button>
        </span></span>
      <span class="vgroup" id="themeGroup"><span class="lab" id="labTheme">Theme</span>
        <span class="seg inline" id="themeSeg" role="group" aria-labelledby="labTheme"></span></span>
    </div>

    <div class="stage" id="stage">
      <div id="viewDesign" role="tabpanel" aria-labelledby="tabDesign">
        <div class="canvas"><div>
          <div class="dark-note" id="darkNote" hidden></div>
          <div class="device work" id="deviceBox"><iframe id="frame" title="Module preview" scrolling="no" tabindex="-1"></iframe></div>
          <div class="device-note" id="deviceNote"></div>
        </div></div>
      </div>
      <div id="viewCode" class="code" role="tabpanel" aria-labelledby="tabCode" hidden>
        <div class="files" id="fileList"></div>
        <div class="codepane">
          <div class="codehead"><span class="path" id="codePath"></span><button type="button" id="btnCopy" title="Copy this file">Copy</button></div>
          <pre class="src" id="codeSrc" tabindex="0" aria-label="File contents"></pre>
        </div>
      </div>
      <div id="viewSteps" class="steps" role="tabpanel" aria-labelledby="tabSteps" hidden></div>
    </div>
    <div class="footer">
      <div class="actions">
        <button type="button" class="primary" id="btnZip" aria-describedby="zipNote" title="Download the .module folder as a zip, for hs cms upload (⌘S)">Download .zip</button>
        <button type="button" id="btnSaveFile" title="Download this module's design as a .hubmod.json file, to keep or send. Open design… brings it back">Download design</button>
        <button type="button" id="copyRecipe" aria-live="polite">Copy recipe</button>
      </div>
      <pre class="recipe" id="recipe" tabindex="0" aria-label="Recipe"></pre>
    </div>
  </main>

  <aside class="right" id="inspector" aria-label="Inspector"></aside>
</div>

<script>
'use strict';
const H = window.HubMod;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const clone = o => JSON.parse(JSON.stringify(o));

// ---------------------------------------------------------------------------------------------------------------
// State. `state` is what undo covers and what the browser keeps: the library of modules and which one is open.
// `ui` is how you are looking at it, kept separately so ⌘Z never flips a tab.
// ---------------------------------------------------------------------------------------------------------------

let SYS = H.normalizeSystem(H.SWITCHYARDS);
const SYS_PATH = 'template-studio/design-systems/switchyards.system.json';
let sysLive = false;   // read from SYS_PATH, not the built-in copy
const state = { library: {}, order: [], openId: null };
const uiDefaults = () => ({ tab: 'design', device: 'desktop', empty: false, dark: false, gmail: false, theme: null, file: 'module.html', sel: null, done: {} });
const ui = uiDefaults();
const saveUi = () => ToolKit.saveAux('ui', { tab: ui.tab, device: ui.device, empty: ui.empty, dark: ui.dark, gmail: ui.gmail, file: ui.file, done: ui.done });

const doc = () => state.library[state.openId] || null;
function defaults() {
  const st = { library: {}, order: [], openId: null };
  // Fixed ids, so what is keyed by a module (the hand-build ticks) still finds it after a reload.
  for (const s of H.STARTERS.filter(s => s.id !== 'blank')) { const d = s.make(SYS); d.id = `m_starter_${s.id}`; st.library[d.id] = d; st.order.push(d.id); }
  st.openId = st.order[0];
  return st;
}
// A structural edit (add, delete, move, drop, duplicate) first records whatever is pending, so it undoes on its own.
function touch() { const d = doc(); if (d) d.updated = new Date().toISOString(); ToolKit.commit(); }

// ---------------------------------------------------------------------------------------------------------------
// Tree helpers
// ---------------------------------------------------------------------------------------------------------------

/** Where a part lives: the array holding it, its index, the container part (columns or repeat) and the column. */
function locate(id, parts = doc().parts, owner = null, col = null) {
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (p.id === id) return { part: p, list: parts, index: i, owner, col };
    if (p.type === 'columns') for (const c of p.cols) { const r = locate(id, c.parts, p, c); if (r) return r; }
    if (p.type === 'repeat') { const r = locate(id, p.parts, p, null); if (r) return r; }
  }
  return null;
}
/** The repeat a part sits inside, if any: its fields belong to that group, not the module. */
function repeatOf(id) {
  let r = locate(id);
  while (r && r.owner) { if (r.owner.type === 'repeat') return r.owner; r = locate(r.owner.id); }
  return null;
}
function allParts(parts = doc().parts, out = []) {
  for (const p of parts) {
    out.push(p);
    if (p.type === 'columns') for (const c of p.cols) allParts(c.parts, out);
    if (p.type === 'repeat') allParts(p.parts, out);
  }
  return out;
}

// ---------------------------------------------------------------------------------------------------------------
// Operations. Every one ends in touch() so it lands in undo and in storage.
// ---------------------------------------------------------------------------------------------------------------

function addPart(type, list, index) {
  ToolKit.flush();
  const d = doc(), p = H.makePart(type, SYS);
  list.splice(index == null ? list.length : index, 0, p);
  settle(p);
  if (p.type === 'image') p.width = Math.min(p.width, H.slotWidth(d, SYS, p.id));
  ui.sel = p.id; touch(); refresh({ inspector: true });
  ToolKit.toast(`${H.TYPES[type].label} added`);
}
function removePart(id) {
  ToolKit.flush();
  const r = locate(id); if (!r) return;
  r.list.splice(r.index, 1);
  ui.sel = r.list[Math.min(r.index, r.list.length - 1)]?.id || (r.owner ? r.owner.id : null);
  touch(); refresh({ inspector: true });
  ToolKit.toast(`Deleted ${H.title(r.part)}. ⌘Z brings it back`);
}
function movePart(id, dir) {
  ToolKit.flush();
  const r = locate(id); if (!r) return;
  const j = r.index + dir; if (j < 0 || j >= r.list.length) return;
  r.list.splice(r.index, 1); r.list.splice(j, 0, r.part);
  touch(); refresh({});
}
function duplicatePart(id) {
  ToolKit.flush();
  const r = locate(id); if (!r) return;
  const copy = H.reid(clone(r.part));
  r.list.splice(r.index + 1, 0, copy);
  settle(copy);
  ui.sel = copy.id; touch(); refresh({ inspector: true });
}
/** Drag and drop in the outline: move a part into another list at an index, if the grammar allows it. */
function dropPart(id, targetList, targetIndex, targetOwner) {
  ToolKit.flush();
  const r = locate(id); if (!r) return;
  if (!H.canHold(targetOwner, r.part)) { ToolKit.toast(H.whyNot(targetOwner, r.part)); return; }
  if (allParts([r.part]).some(p => (p.cols && p.cols.some(c => c.parts === targetList)) || (p.type === 'repeat' && p.parts === targetList))) { ToolKit.toast('A part cannot go inside itself'); return; }
  r.list.splice(r.index, 1);
  if (r.list === targetList && r.index < targetIndex) targetIndex--;
  targetList.splice(targetIndex, 0, r.part);
  if (r.list !== targetList) settle(r.part);
  ui.sel = r.part.id; touch(); refresh({ inspector: true });
}
/** After a part lands: unique names in its new scope, and no "switch it off" inside a group, where it means nothing. */
function settle(p) {
  H.claimNames(doc(), p);
  if (repeatOf(p.id)) allParts([p]).forEach(q => { q.toggle = false; });
}

// ---------------------------------------------------------------------------------------------------------------
// Library
// ---------------------------------------------------------------------------------------------------------------

function openModule(id) { state.openId = id; ui.sel = null; ui.theme = null; ToolKit.commit(); refresh({ inspector: true }); }
function newModule(starterId) {
  const s = H.STARTERS.find(x => x.id === starterId) || H.STARTERS[0];
  const d = s.make(SYS);
  d.name = uniqueName(d.name); H.syncSlug(d);
  state.library[d.id] = d; state.order.unshift(d.id); openModule(d.id);
  ToolKit.toast(`${d.name} created`);
}
function uniqueName(base) {
  const names = new Set(state.order.map(id => state.library[id].name));
  if (!names.has(base)) return base;
  for (let i = 2; ; i++) if (!names.has(`${base} ${i}`)) return `${base} ${i}`;
}
function duplicateModule() {
  const d = doc(); if (!d) return;
  const c = H.reid(clone(d)); c.id = H.uid('m'); c.name = uniqueName(`${d.name} copy`); c.exported = null; H.syncSlug(c, true);
  state.library[c.id] = c; state.order.splice(state.order.indexOf(d.id) + 1, 0, c.id); openModule(c.id);
}
function deleteModule() {
  ToolKit.flush();
  const d = doc(); if (!d) return;
  const i = state.order.indexOf(d.id); state.order.splice(i, 1); delete state.library[d.id];
  if (!state.order.length) { const n = H.STARTERS.find(s => s.id === 'blank').make(SYS); state.library[n.id] = n; state.order.push(n.id); }
  state.openId = state.order[Math.min(i, state.order.length - 1)]; ui.sel = null;
  touch(); refresh({ inspector: true });
  ToolKit.toast(`Deleted ${d.name}. ⌘Z brings it back`);
}
function saveFile() {
  const d = doc(); if (!d) return;
  download(new Blob([JSON.stringify({ hubmod: 1, module: d }, null, 2)], { type: 'application/json' }), `${d.slug}.hubmod.json`);
}
async function openFile(file) {
  try {
    const o = JSON.parse(await file.text());
    const src = o && typeof o === 'object' && !Array.isArray(o) ? (o.module || o) : null;
    // fields.json and meta.json from an export are JSON too; a design has parts.
    if (!src || typeof src !== 'object' || !Array.isArray(src.parts)) throw new Error('no parts in it; a .hubmod.json from Download design is');
    const m = H.migrate(src);
    // The same module, opened again, replaces itself: its name and folder are what HubSpot knows it by.
    if (m.id && state.library[m.id]) {
      state.library[m.id] = m; openModule(m.id); touch();
      ToolKit.toast(`${m.name} replaced by the opened file. ⌘Z brings the old one back`); return;
    }
    if (!m.id) m.id = H.uid('m');
    state.library[m.id] = m; state.order.unshift(m.id); openModule(m.id);
    ToolKit.toast(`Opened ${m.name}`);
  } catch (e) { ToolKit.toast(`That file is not a HUB-MOD design (${e.message})`); }
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }

// ---------------------------------------------------------------------------------------------------------------
// Rendering the app. refresh() is the one way in; it rebuilds the inspector only when asked, because rebuilding it
// while someone types steals their caret (learnings 3.3).
// ---------------------------------------------------------------------------------------------------------------

let built = null, issues = [];
function refresh(opts = {}) {
  const d = doc(); if (!d) return;
  if (ui.sel && !locate(ui.sel)) ui.sel = null;
  if (!ui.theme || !d.themes.includes(ui.theme)) ui.theme = d.themes[0];
  try { built = H.build(d, SYS); issues = H.check(d, SYS, built); }
  catch (e) {
    // Never leave the last module's build in place: Download would zip it under this one's name.
    built = null; issues = [{ level: 'error', msg: `This module does not build: ${e.message}`, partId: null }];
    try { issues = H.check(d, SYS, null).concat(issues); } catch (x) { /* the message above says enough */ }
  }
  const twin = state.order.find(id => id !== d.id && state.library[id].slug === d.slug);
  if (twin) issues.push({ level: 'warning', msg: `“${state.library[twin].name}” uses the same folder, ${d.slug}. Upload both and one replaces the other in HubSpot.`, partId: null });
  renderLibrary(); renderOutline(); renderIssues(); renderBar();
  if (opts.inspector) renderInspector(); else syncInspectorHead();
  schedulePreview();
  if (ui.tab === 'code') renderCode();
  if (ui.tab === 'steps') renderSteps();
}

function renderLibrary() {
  $('#libCount').textContent = String(state.order.length);
  $('#lib').innerHTML = state.order.map(id => {
    const m = state.library[id], n = H.countFields(m), on = id === state.openId;
    return `<button type="button" class="item${on ? ' on' : ''}" data-id="${esc(id)}" title="${esc(m.description || m.name)}"${on ? ' aria-current="true"' : ''}><span class="name">${esc(m.name)}</span><span class="meta">${n} field${n === 1 ? '' : 's'}</span></button>`;
  }).join('');
}

function renderBar() {
  // The tabs say which is open to a screen reader too; only the open one is in the Tab order (arrows move along).
  $$('#tabs button').forEach(b => { const on = b.dataset.tab === ui.tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  const press = (sel, test) => $$(sel).forEach(b => { const on = test(b); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  press('#device button', b => b.dataset.device === ui.device);
  press('#content button', b => (b.dataset.content === 'empty') === ui.empty);
  press('#darkSeg button', b => (b.dataset.dark === '1') === ui.dark);
  press('#clientSeg button', b => (b.dataset.client === 'gmail') === ui.gmail);
  const d = doc();
  const ts = $('#themeSeg');
  ts.hidden = d.themes.length < 2;
  $('#themeGroup').hidden = ts.hidden;   // the group's label goes with it
  ts.innerHTML = d.themes.filter(t => SYS.themes[t]).map(t => `<button type="button" data-theme="${t}" class="${t === ui.theme ? 'on' : ''}" aria-pressed="${t === ui.theme}" title="Preview the ${esc(SYS.themes[t].label)} theme the team can pick"><span class="swatch" style="background:${SYS.themes[t].bg}"></span><span>${esc(SYS.themes[t].label)}</span></button>`).join('');
  $('#designBar').hidden = ui.tab !== 'design';
  $('#viewDesign').hidden = ui.tab !== 'design';
  $('#viewCode').hidden = ui.tab !== 'code';
  $('#viewSteps').hidden = ui.tab !== 'steps';
  const errs = issues.filter(i => i.level === 'error').length;
  const z = $('#btnZip'); z.disabled = errs > 0;
  z.title = errs ? `Fix ${errs} error${errs > 1 ? 's' : ''} under Checks first: HubSpot would refuse this module, or the team would get a broken one` : 'Download the .module folder as a zip, for hs cms upload (⌘S)';
  renderRecipe(errs);
}

// ---- the recipe: the module in a few lines, beside the exports ----
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const andList = a => a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`;
/** What the checks found, in words: 'clear', '2 errors', '1 error · 3 warnings'. */
function checkWords() {
  const errs = issues.filter(i => i.level === 'error').length, warns = issues.length - errs;
  return issues.length ? [errs && plural(errs, 'error'), warns && plural(warns, 'warning')].filter(Boolean).join(' · ') : 'clear';
}
let recipeText = '';
function renderRecipe(errs) {
  const d = doc(), n = H.countFields(d);
  const px = k => `${k === '0' || k === 0 ? 0 : SYS.space[k] || 0} px`;   // 'Space 0 px top', never 'Space none top'
  const themes = d.themes.map((t, i) => `${SYS.themes[t] ? SYS.themes[t].label : `${t} (missing)`}${i === 0 && d.themes.length > 1 ? ' (default)' : ''}`);
  const on = v => v ? 'on' : 'off';
  recipeText = [
    `HubSpot email module ${String(d.name || '').trim() ? `“${d.name.trim()}”` : 'with no name'}, folder ${d.slug}.module, ${plural(n, 'field')}.`,
    `${themes.length > 1 ? 'Themes' : 'Theme'} ${andList(themes)}. Space ${px(d.pad.top)} top, ${px(d.pad.bottom)} bottom, ${px(d.pad.side)} sides. Made for ${d.width} px, content ${H.contentWidth(d, SYS)} px.`,
    `Style blocks: rich text rules ${on(d.css.rich)}, phone and dark-mode rules ${on(d.css.sheet)}.`,
    `Checks: ${checkWords().replace(' · ', ', ')}.`,
  ].join('\n');
  // A disabled button's tooltip is easy to miss, so why it is off leads the recipe beside it.
  const why = errs ? `<span id="zipNote">Fix ${plural(errs, 'error')} under Checks first.</span>\n` : '';
  $('#recipe').innerHTML = why + esc(recipeText);
}

// ---- outline ----
function renderOutline() {
  const d = doc();
  $('#fieldCount').textContent = plural(H.countFields(d), 'field');
  const box = $('#outline');
  const keep = box.contains(document.activeElement);   // the keyboard was in the list: it stays there through the rebuild
  box.innerHTML = '';
  box.appendChild(outlineList(d.parts, null, null, 1));
  // One stop in the Tab order: the selected row, or the first. The arrow keys step from there (stepSel).
  const stop = $('.orow.on', box) || $('.orow', box);
  if (stop) { stop.tabIndex = 0; if (keep) stop.focus(); }
}
// A tree to a screen reader: each row a treeitem with its name, its kind, its level and whether it is selected. The
// selection follows the arrow keys (stepSel), as a single-select tree's does.
function outlineList(list, owner, col, level) {
  const wrap = document.createElement('div'); wrap.className = owner ? 'nest' : '';
  wrap._list = list; wrap._owner = owner;
  if (owner) { wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', col ? `Column ${owner.cols.indexOf(col) + 1}` : owner.label || H.TYPES[owner.type].label); }
  else { wrap.setAttribute('role', 'tree'); wrap.setAttribute('aria-label', 'Parts'); }
  if (!list.length) {
    const empty = document.createElement('div'); empty.className = 'oempty';
    empty.textContent = owner ? 'Empty. Add a part, or drag one here.' : 'No parts yet.';
    empty._list = list; empty._owner = owner;
    wrap.appendChild(empty);
  }
  list.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = `orow${p.id === ui.sel ? ' on' : ''}`; row.dataset.id = p.id; row.draggable = true;
    row.tabIndex = -1;
    row._list = list; row._index = i; row._owner = owner;
    const t = H.TYPES[p.type];
    const kind = t.container ? '' : H.isEditable(p) ? 'field' : 'fixed';
    row.setAttribute('role', 'treeitem'); row.setAttribute('aria-selected', String(p.id === ui.sel));
    row.setAttribute('aria-level', String(level)); row.setAttribute('aria-setsize', String(list.length)); row.setAttribute('aria-posinset', String(i + 1));
