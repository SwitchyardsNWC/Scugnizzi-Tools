let labelSeq = 0;
function linkLabels(root) {
  for (const l of $$('.row>label, .stack>label', root)) {
    if (l.htmlFor || l.querySelector('input,select,textarea')) continue;
    const box = l.parentElement, inRow = box.classList.contains('row');
    const c = inRow ? $(':scope>.ctl input, :scope>.ctl select, :scope>.ctl textarea, :scope>.ctl .seg', box)
      : $(':scope>input, :scope>select, :scope>textarea, :scope>.namefield>input, :scope>.seg', box);
    if (!c) continue;
    if (c.classList.contains('seg')) { l.id = `hmLab${++labelSeq}`; c.setAttribute('role', 'group'); c.setAttribute('aria-labelledby', l.id); }
    else { if (!c.id) c.id = `hmCtl${++labelSeq}`; l.htmlFor = c.id; }
  }
  // A field with no label of its own (the default text under "Default content") is named by its section.
  for (const c of $$('input:not([type=checkbox]), select, textarea', root)) {
    if ((c.labels && c.labels.length) || c.hasAttribute('aria-label')) continue;
    const t = c.closest('.pane') && $('.pane-head .t', c.closest('.pane')); if (t) c.setAttribute('aria-label', t.textContent);
  }
}
function syncInspectorHead() {
  const r = ui.sel ? locate(ui.sel) : null;
  if (!r) { const d = doc(); const sh = $('#slugHead', insp); if (sh && d) sh.textContent = `${d.slug}.module`; const cw = $('#cwHint', insp); if (cw && d) cw.textContent = `${H.contentWidth(d, SYS)} px`; return; }
  // A field or a group says its HubL path, in mono; anything else says what it is, in words.
  const s = $('.insp-head .t span', insp);
  if (s) { const path = H.isEditable(r.part) || r.part.type === 'repeat'; s.textContent = path ? H.fieldPath(doc(), r.part) : H.TYPES[r.part.type].container ? 'Layout only' : 'Fixed, not editable'; s.classList.toggle('prose', !path); }
  const nm = $('[data-k="name"]', insp); if (nm && document.activeElement !== nm) nm.value = r.part.name || '';
  const ph = $('#pathHint', insp);
  if (ph) { const p = r.part; ph.textContent = p.type === 'repeat' ? `{% for item in ${H.fieldPath(doc(), p)} %}` : `${H.fieldPath(doc(), p)}${H.hasLink(p) ? `, ${H.fieldPath(doc(), p, '_link')}` : ''}`; }
  const au = $('#nameAuto', insp); if (au) au.hidden = !r.part.nameAuto;
}

// Small builders. Every control carries data-k (the property) and data-t (how to read it).
// Entry, Entries; Box, Boxes; Event, Events.
const pluralOf = w => /[^aeiou]y$/i.test(w) ? w.slice(0, -1) + 'ies' : /(s|x|z|ch|sh)$/i.test(w) ? w + 'es' : w + 's';
const row = (label, ctl, title = '') => `<div class="row"${title ? ` title="${esc(title)}"` : ''}><label>${esc(label)}</label><div class="ctl">${ctl}</div></div>`;
const txt = (k, v, ph = '') => `<input type="text" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const num = (k, v, min, max, step = 1) => `<input type="number" data-k="${k}" data-t="num" value="${esc(v)}" min="${min}" max="${max}" step="${step}">`;
const sel = (k, v, opts, t = '') => `<select data-k="${k}"${t ? ` data-t="${t}"` : ''}>${opts.map(([val, lab]) => `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
// A title, when given, is on the box and its words: it shows on hover and a screen reader reads it as the description.
const chk = (k, v, label, help = '', title = '') => { const t = title ? ` title="${esc(title)}"` : ''; return `<label class="check"${t}><input type="checkbox" data-k="${k}" data-t="bool" ${v ? 'checked' : ''}${t}><span>${esc(label)}${help ? `<small>${esc(help)}</small>` : ''}</span></label>`; };
const segs = (k, v, opts, t = '') => `<span class="seg">${opts.map(([val, lab, title]) => `<button type="button" data-seg="${k}"${t ? ` data-t="${t}"` : ''} data-v="${esc(val)}" class="${String(val) === String(v) ? 'on' : ''}" aria-pressed="${String(val) === String(v)}"${title ? ` title="${esc(title)}"` : ''}>${esc(lab)}</button>`).join('')}</span>`;
// A pane's head: its name, then a bare count (.n, mono) or a state in words (.v).
const pane = (title, body, n = '', v = '') => `<div class="pane"><div class="pane-head"><span class="t">${esc(title)}</span>${n !== '' ? `<span class="n">${esc(n)}</span>` : ''}${v ? `<span class="v">${esc(v)}</span>` : ''}</div>${body}</div>`;
const colorOpts = () => [['text', 'Theme text'], ['accent', 'Theme accent'], ...Object.entries(SYS.colors).map(([k, v]) => [k, `${SYS.colorNames[k] || k} · ${v}`])];
const alignSeg = (v, k = 'align') => segs(k, v, [['left', 'Left'], ['center', 'Centre'], ['right', 'Right']]);

function moduleInspector(d) {
  const themes = Object.entries(SYS.themes);
  const spaceOpts = [['0', 'None · 0'], ...Object.entries(SYS.space).map(([k, v]) => [k, `${k.toUpperCase()} · ${v} px`])];
  return `<div class="insp-head"><span class="glyph">▣</span><span class="t"><b>Module</b><span id="slugHead">${esc(d.slug)}.module</span></span></div>
  ${pane('Module', `
    <div class="stack"><label>Name in HubSpot</label>${txt('m.name', d.name)}</div>
    <div class="stack" title="The folder name, and so the module's path in Design Manager. Lower case, digits and hyphens."><label>Folder</label><div class="namefield">${txt('m.slug', d.slug)}<span class="auto" id="slugAuto"${d.slugAuto ? '' : ' hidden'}>auto</span></div></div>
    <div class="stack"><label>Note for the library</label>${txt('m.description', d.description, 'What it is for, in a line')}</div>`)}
  ${pane('Themes', `
    <p class="hint">Tick more than one and the team picks in HubSpot. The first ticked is the default.</p>
    ${themes.map(([k, t]) => `<label class="check"><input type="checkbox" data-theme-allow="${k}" ${d.themes.includes(k) ? 'checked' : ''}><span>${esc(t.label)}<span class="swatch" style="background:${t.bg}" aria-hidden="true"></span><span class="hex">${esc(String(t.bg).toLowerCase())}</span><small>${esc(`${SYS.colorNames[t.bgToken] || t.bgToken} ground, ${SYS.colorNames[t.textToken] || t.textToken} text, ${t.button} button`)}</small></span></label>`).join('')}
    ${d.themes.length > 1 ? row('Default', sel('m.themeDefault', d.themes[0], d.themes.map(t => [t, (SYS.themes[t] || { label: `${t} (missing)` }).label])), 'What a new copy of the module starts as') : ''}
    ${d.themes.filter(t => !SYS.themes[t]).map(t => `<label class="check"><input type="checkbox" data-theme-allow="${esc(t)}" checked><span>${esc(t)}<small>Not in the design system any more. Untick it.</small></span></label>`).join('')}`)}
  ${pane('Space', `
    ${row('Top', sel('m.pad.top', d.pad.top, spaceOpts))}
    ${row('Bottom', sel('m.pad.bottom', d.pad.bottom, spaceOpts))}
    ${row('Sides', sel('m.pad.side', d.pad.side, spaceOpts), 'Inside the module, left and right. The phone rules keep it.')}
    ${row('Made for', sel('m.width', d.width, [[600, 'Full width · 600 px'], [300, 'Half column · 300 px']], 'num'), 'A drag-and-drop email is 600 px wide. Images size against this; dropped somewhere narrower, everything shrinks to fit.')}
    <p class="hint">Content width <span class="mono" id="cwHint">${H.contentWidth(d, SYS)} px</span>. In a narrower column the module shrinks and its columns stack.</p>`)}
  ${pane('Style blocks', `
    <p class="hint">What has to hold is inline; these add what cannot be. HubSpot warns and still sends.</p>
    ${chk('m.css.rich', d.css.rich, 'Rich text rules', 'Margins, headings, lists and links in rich text. HubSpot should inline it; test once.', 'HubSpot should inline these rules at send. One test send has to confirm it.')}
    ${chk('m.css.sheet', d.css.sheet, 'Phone and dark-mode rules', 'Phone font sizes and the dark layers. Gmail strips them.', 'Apple Mail and Outlook.com read them; Gmail strips them.')}`)}
  ${pane('In HubSpot', `
    <p class="hint">Select a part to set what the team edits. The sidebar shows <span class="tag field">field</span> parts in this order:</p>
    <ol class="hint">${(built ? built.steps.fields : []).filter(f => !f.child).map(f => `<li>${esc(f.label)} <span class="mono">· ${esc(f.uiType)}</span></li>`).join('') || '<li>None yet</li>'}</ol>`)}`;
}

function partInspector(d, r) {
  const p = r.part, T = H.TYPES[p.type], rep = repeatOf(p.id);
  const head = `<div class="insp-head"><span class="glyph">${esc(H.glyph(p))}</span><span class="t"><b>${esc(T.label)}${rep ? ` <em class="in">in ${esc(rep.label)}</em>` : ''}</b><span></span></span>
    <span class="acts"><button type="button" class="icon" data-act="up" title="Move up (⌥↑)" aria-label="Move up">↑</button><button type="button" class="icon" data-act="down" title="Move down (⌥↓)" aria-label="Move down">↓</button><button type="button" class="icon" data-act="dup" title="Duplicate (⌘D)" aria-label="Duplicate">⧉</button><button type="button" class="icon danger" data-act="del" title="Delete part (⌫)" aria-label="Delete part">×</button><button type="button" class="icon" data-act="close" title="Back to the module (Esc)" aria-label="Back to the module">↰</button></span></div>`;
  let body = '';
  if (p.type === 'columns') body = columnsInspector(p);
  else if (p.type === 'repeat') body = repeatInspector(p);
  else body = contentPane(p, rep) + (T.field ? fieldPane(p, rep) : '') + stylePane(p, rep);
  return head + body;
}

function contentPane(p, rep) {
  const editable = H.isEditable(p);
  const title = editable ? (rep ? `Default for new ${pluralOf(rep.itemLabel || 'item')}` : 'Default content') : 'Content';
  // No labels in the words, so it stays two lines whatever the team calls the group: the pane's title names the item.
  const hint = editable ? `<p class="hint">${rep ? 'What a new one holds until the team replaces it. Each has its own on the group.' : 'What the field holds when the team drops the module in. They replace it.'}</p>` : '';
  let b = '';
  switch (p.type) {
    case 'eyebrow': case 'heading': case 'text':
      b = `<div class="stack">${txt('value', p.value)}<span class="hint">One line: HubSpot's text field has no line breaks.</span></div>
        ${chk('link', p.link, 'Linked', editable ? 'The words are a link; the team sets where it goes' : 'The words are a link')}
        ${p.link ? `<div class="stack"><label>Link</label><input type="url" data-k="href" value="${esc(p.href)}" placeholder="https://"></div>` : ''}`; break;
    case 'richtext':
      b = `<div class="stack"><textarea data-k="value" rows="6">${esc(p.value)}</textarea><span class="hint">HTML: <span class="mono">p strong em a ul ol li h3 h4 blockquote</span>. Styled by the rich text rules.</span></div>`; break;
    case 'image':
      b = `<div class="stack"><label>Image URL</label><input type="url" data-k="src" value="${esc(p.src)}" placeholder="https://… hosted in HubSpot Files"><span class="hint">A hosted https address, or empty to start blank. A local file loads for no one else.</span></div>
        <div class="stack"><label>Alt text</label>${txt('alt', p.alt, 'Says what the picture shows')}</div>
        ${chk('link', p.link, 'Linked', 'The picture is a link; the team sets where it goes')}
        ${p.link ? `<div class="stack"><label>Link</label><input type="url" data-k="href" value="${esc(p.href)}" placeholder="https://"></div>` : ''}`; break;
    case 'button':
      b = `<div class="stack"><label>Label</label>${txt('value', p.value)}</div><div class="stack"><label>Link</label><input type="url" data-k="href" value="${esc(p.href)}" placeholder="https://"></div>`; break;
    case 'divider': b = ''; break;
    case 'spacer': b = ''; break;
  }
  return b ? pane(title, hint + b) : '';
}

function fieldPane(p, rep) {
  const on = H.isEditable(p);
  const two = H.hasLink(p);
  const body = `${chk('editable', p.editable, 'Editable in HubSpot', on ? 'The team fills this in.' : 'Fixed: it ships as designed and a re-upload changes every email.')}
    ${on ? `
      <div class="stack"><label>Label the team reads</label>${txt('label', p.label)}<span class="hint">The label is the whole interface. Write it like microcopy.</span></div>
      <div class="stack" title="The name module.html reads it by. Renaming it after the module is in use loses what the team typed into the old one."><label>HubL name</label><div class="namefield">${txt('name', p.name)}<span class="auto" id="nameAuto"${p.nameAuto ? '' : ' hidden'}>auto</span></div>
        <span class="hint mono" id="pathHint">${esc(H.fieldPath(doc(), p))}${two ? `, ${esc(H.fieldPath(doc(), p, '_link'))}` : ''}</span></div>
      <div class="stack"><label>Help text</label>${txt('help', p.help, 'Optional: shown under the field in HubSpot')}<span class="hint">HubSpot's inline help text, 400 characters at most.</span></div>
      ${chk('required', p.required, 'Required', 'HubSpot will not publish an email with it blank')}
      ${H.TYPES[p.type].collapses ? chk('optional', p.optional, 'Hide when empty', 'A blank field removes the part and its space, not just the words') : ''}
      ${p.type === 'image' ? '<p class="hint">With no picture picked, the part and its space go: an empty image is never drawn.</p>' : ''}
      ${rep ? '' : chk('toggle', p.toggle, 'Team can switch it off', 'Adds a Show checkbox above the field')}` : ''}`;
  return pane('Field', body, '', on ? 'field' : 'fixed');
}

function stylePane(p, rep) {
  const styleOpts = Object.entries(SYS.text).map(([k, s]) => [k, `${s.label} · ${s.size} px${s.weight === 'bold' ? ' bold' : ''}${s.uppercase ? ' caps' : ''}`]);
  let b = '';
  switch (p.type) {
    case 'eyebrow': case 'heading': case 'text':
      b = row('Style', sel('style', p.style, styleOpts)) + row('Colour', sel('color', p.color, colorOpts()), 'Theme colours follow the theme the team picks; a named colour stays put') + row('Align', alignSeg(p.align)) + row('Space below', num('gap', p.gap, 0, 120) + '<span class="hint">px</span>'); break;
    case 'richtext':
      b = row('Size', sel('style', p.style, styleOpts.filter(([k]) => ['body', 'small'].includes(k)))) + row('Colour', sel('color', p.color, colorOpts())) + row('Links', sel('linkColor', p.linkColor, colorOpts())) + row('Align', alignSeg(p.align)) + row('Space below', num('gap', p.gap, 0, 120) + '<span class="hint">px</span>'); break;
    case 'image': {
      const max = H.slotWidth(doc(), SYS, p.id);
      b = row('Width', num('width', p.width, 40, max) + `<span class="hint">px of ${max}</span>`, 'The display width. HubSpot reports the uploaded file\'s own width; the module never uses it (learnings 1.6a).')
        + `<div class="row"><span class="lab"></span><div class="ctl"><button type="button" data-fill="1" title="As wide as its column">Fill ${max} px</button></div></div>`
        + row('Align', alignSeg(p.align)) + chk('phoneFull', p.phoneFull, 'Full width on phones', 'Stretches to the screen on a phone')
        + row('Corners', num('radius', p.radius, 0, 60) + '<span class="hint">px</span>') + '<p class="row-note">Square in Outlook on Windows.</p>'
        + row('Space below', num('gap', p.gap, 0, 120) + '<span class="hint">px</span>'); break; }
    case 'button':
      b = chk('themed', p.themed, 'Use the theme\'s button', 'Navy theme swaps to the secondary button, as the system does')
        + (p.themed ? '' : row('Variant', segs('variant', p.variant, Object.entries(SYS.buttons).map(([k, v]) => [k, v.label, `${SYS.colorNames[v.fillToken] || v.fillToken} fill, ${SYS.colorNames[v.inkToken] || v.inkToken} label, ${v.radius} px corners`]))))
        + row('Align', alignSeg(p.align)) + chk('full', p.full, 'Full width', 'The button spans its column') + chk('phoneFull', p.phoneFull, 'Full width on phones')
        + row('Space below', num('gap', p.gap, 0, 120) + '<span class="hint">px</span>'); break;
    case 'divider':
      b = row('Colour', sel('color', p.color, colorOpts())) + row('Thickness', num('thickness', p.thickness, 1, 12) + '<span class="hint">px</span>') + row('Length', num('length', p.length, 5, 100) + '<span class="hint">%</span>') + row('Align', alignSeg(p.align)) + row('Space below', num('gap', p.gap, 0, 120) + '<span class="hint">px</span>'); break;
    case 'spacer':
      b = row('Height', num('height', p.height, 4, 200) + '<span class="hint">px</span>') + row('On phones', num('phoneHeight', p.phoneHeight, 0, 200) + '<span class="hint">px</span>') + '<p class="row-note">0 keeps the height above.</p>'; break;
  }
  return pane('Style', b);
}

function columnsInspector(p) {
  const splits = p.cols.length === 2 ? [['50,50', '½ ½'], ['33,67', '⅓ ⅔'], ['67,33', '⅔ ⅓'], ['40,60', '40 60'], ['60,40', '60 40']] : [['33,34,33', '⅓ ⅓ ⅓'], ['25,50,25', '¼ ½ ¼'], ['50,25,25', '½ ¼ ¼']];
  const cur = p.cols.map(c => c.w).join(',');
  return pane('Columns', `
    ${row('Count', segs('count', p.cols.length, [[2, 'Two'], [3, 'Three']], 'num'))}
    <div class="stack"><label>Split</label>${segs('split', cur, splits)}</div>
    ${row('Gap', num('gap', p.gap, 0, 80) + '<span class="hint">px</span>')}
    ${row('Line up', segs('valign', p.valign, [['top', 'Top'], ['middle', 'Middle'], ['bottom', 'Bottom']]))}
    ${chk('stack', p.stack, 'Stack on phones', 'Below the design’s width, in every client. Outlook on Windows gets a plain table.')}
    ${row('Space below', num('gap2', p.gapBelow, 0, 120) + '<span class="hint">px</span>')}
    <p class="hint">${p.stack ? 'Needs no style block: each column takes its share or the screen, whichever is less.' : 'A plain table: the columns keep their shares at every width.'}</p>
    <p class="hint">Columns are layout only. Their parts' fields join the module's list in reading order.</p>`)
    + pane('Swap', `<button type="button" data-swap="1" title="Reverse the column order">Swap columns</button>`);
}

function repeatInspector(p) {
  const kids = allParts(p.parts).filter(H.isEditable);
  const items = p.items.map((it, i) => `<div class="itemcard" data-item="${i}">
      <div class="ih"><span>${esc(p.itemLabel || 'Item')} ${i + 1}</span><span class="grow"></span>
        <button type="button" class="icon" data-item-act="up" data-i="${i}" title="Move up" aria-label="Move ${esc(p.itemLabel || 'item')} ${i + 1} up"${i === 0 ? ' disabled' : ''}>↑</button><button type="button" class="icon" data-item-act="down" data-i="${i}" title="Move down" aria-label="Move ${esc(p.itemLabel || 'item')} ${i + 1} down"${i === p.items.length - 1 ? ' disabled' : ''}>↓</button><button type="button" class="icon danger" data-item-act="del" data-i="${i}" title="Delete ${esc((p.itemLabel || 'item').toLowerCase())} ${i + 1}" aria-label="Delete ${esc((p.itemLabel || 'item').toLowerCase())} ${i + 1}">×</button></div>
      ${kids.map(k => itemControl(p, it, i, k)).join('') || '<span class="hint">No editable parts inside yet.</span>'}
    </div>`).join('');
  return pane('Repeating group', `
    <div class="stack"><label>Group label</label>${txt('label', p.label)}</div>
    <div class="stack" title="The name module.html loops over. Renaming it after use loses every item the team made."><label>HubL name</label><div class="namefield">${txt('name', p.name)}<span class="auto" id="nameAuto"${p.nameAuto ? '' : ' hidden'}>auto</span></div><span class="hint mono" id="pathHint">{% for item in ${esc(H.fieldPath(doc(), p))} %}</span></div>
    <div class="stack"><label>One of them is called</label>${txt('itemLabel', p.itemLabel, 'Event')}</div>
    ${row('Min', num('min', p.min, 0, 50))}
    ${row('Max', num('max', p.max, 1, 50))}
    ${kids.length ? row('Sort label', sel('sortField', p.sortField || '', [['', 'Automatic'], ...kids.filter(k => ['text', 'eyebrow', 'heading'].includes(k.type)).map(k => [k.id, k.label])]), 'Which field names each item in HubSpot\'s list') : ''}
  `) + pane('Layout', `
    ${row('Arrange', segs('layout', p.layout, [['list', 'List', 'One under another'], ['grid', 'Grid', 'Side by side, in rows']]))}
    ${p.layout === 'grid' ? row('Per row', segs('perRow', p.perRow, [[2, 'Two'], [3, 'Three']], 'num')) + chk('stack', p.stack, 'One per row on phones', 'In every client, Gmail included. Off, the rows keep their count at any width.') : ''}
    ${row('Gap', num('gap', p.gap, 0, 80) + '<span class="hint">px</span>')}
    ${p.layout === 'list' ? chk('rule', p.rule, 'Rule between items', 'A hairline in the theme accent') : ''}
    ${row('Space below', num('gap2', p.gapBelow, 0, 120) + '<span class="hint">px</span>')}
  `) + pane(`${pluralOf(p.itemLabel || 'Item')} it starts with`, `<p class="hint">What a new copy of the module holds. The team adds and removes their own, ${p.min}–${p.max}.</p><div class="items">${items}</div>
    <button type="button" data-item-act="add" ${p.items.length >= p.max ? 'disabled' : ''}>+ ${esc(p.itemLabel || 'Item')}</button>`, String(p.items.length));
}
function itemControl(rep, it, i, k) {
  const v = H.itemValue(rep, it, k);
  const key = `item:${i}:${k.id}`;
  switch (k.type) {
    case 'richtext': return `<div class="stack"><label>${esc(k.label)}</label><textarea data-k="${key}" rows="3">${esc(v)}</textarea></div>`;
    case 'image': return `<div class="stack"><label>${esc(k.label)} URL</label><input type="url" data-k="${key}:src" value="${esc(v.src)}" placeholder="https://"></div><div class="stack"><label>${esc(k.label)} alt</label><input type="text" data-k="${key}:alt" value="${esc(v.alt)}"></div>${k.link ? `<div class="stack"><label>${esc(k.label)} link</label><input type="url" data-k="${key}:href" value="${esc(v.href)}"></div>` : ''}`;
    case 'button': return `<div class="stack"><label>${esc(k.label)} label</label><input type="text" data-k="${key}:value" value="${esc(v.value)}"></div><div class="stack"><label>${esc(k.label)} link</label><input type="url" data-k="${key}:href" value="${esc(v.href)}"></div>`;
    default: return H.hasLink(k)
      ? `<div class="stack"><label>${esc(k.label)}</label><input type="text" data-k="${key}:value" value="${esc(v.value)}"></div><div class="stack"><label>${esc(k.label)} link</label><input type="url" data-k="${key}:href" value="${esc(v.href)}"></div>`
      : `<div class="stack"><label>${esc(k.label)}</label><input type="text" data-k="${key}" value="${esc(v)}"></div>`;
  }
}

// Inspector input: one listener for every control.
insp.addEventListener('input', e => onInspector(e, false));
insp.addEventListener('change', e => onInspector(e, true));
function onInspector(e, final) {
  const el = e.target; const k = el.dataset.k;
  const d = doc();
  if (el.dataset.themeAllow) {
    if (!final) return;
    const t = el.dataset.themeAllow;
    if (el.checked) { if (!d.themes.includes(t)) d.themes.push(t); }
    else if (d.themes.length > 1) d.themes = d.themes.filter(x => x !== t); else { el.checked = true; ToolKit.toast('A module wears at least one theme'); return; }
    touch(); refresh({ inspector: true }); return;
  }
  if (!k) return;
  let v = el.dataset.t === 'bool' ? el.checked : el.value;
  if (el.dataset.t === 'num') { if (!final && el.value === '') return; v = Number(el.value); if (!Number.isFinite(v)) return; if (final) { const lo = el.min === '' ? -Infinity : +el.min, hi = el.max === '' ? Infinity : +el.max; v = Math.max(lo, Math.min(hi, v)); el.value = v; } }
  if (k.startsWith('m.')) return moduleInput(d, k.slice(2), v, el, final);
  const r = locate(ui.sel); if (!r) return;
  const p = r.part;
  if (k.startsWith('item:')) { const [, i, id, sub] = k.split(':'); H.setItemValue(p, +i, id, sub, v); touch(); refresh({}); return; }
  if (k === 'gap2') p.gapBelow = v;
  else if (k === 'label') { p.label = v; if (p.nameAuto) { p.name = H.uniqueFieldName(d, p, H.fieldNameFrom(v, p.type)); } }
  else if (k === 'name') { p.name = H.fieldNameFrom(v, p.type, true); p.nameAuto = false; if (final) el.value = p.name; }
  else if (k === 'sortField') p.sortField = v || null;
  else p[k] = v;
  if (k === 'required' && v) p.optional = false;
  if (k === 'optional' && v) p.required = false;
  if (k === 'min' && p.items && final) { p.max = Math.max(p.max, v); }
  if (k === 'max' && p.items && final) { p.min = Math.min(p.min, v); }
  touch();
  // Some settings change which controls exist; rebuild for those, never for typing.
  const restructure = ['editable', 'link', 'layout', 'required', 'optional', 'min', 'max'].includes(k);
  refresh({ inspector: restructure && final || ['editable', 'link', 'required', 'optional', 'themed'].includes(k) });
  if (k === 'label' || k === 'name') syncInspectorHead();
}
function moduleInput(d, k, v, el, final) {
  if (k === 'name') { d.name = v; if (d.slugAuto) H.syncSlug(d); const s = $('[data-k="m.slug"]', insp); if (s && d.slugAuto) s.value = d.slug; }
  else if (k === 'slug') { d.slug = H.slugFrom(v, true); d.slugAuto = false; $('#slugAuto').hidden = true; if (final) el.value = d.slug; }
  else if (k === 'description') d.description = v;
  else if (k === 'themeDefault') { d.themes = [v, ...d.themes.filter(t => t !== v)]; ui.theme = v; }
  else if (k.startsWith('pad.')) d.pad[k.slice(4)] = v;
  else if (k.startsWith('css.')) d.css[k.slice(4)] = v;
  else if (k === 'width') d.width = v;
  touch(); refresh({ inspector: final && ['themeDefault', 'width'].includes(k) });
}
insp.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = doc(), r = ui.sel ? locate(ui.sel) : null;
  if (b.dataset.act) {
    const id = ui.sel;
    ({ up: () => movePart(id, -1), down: () => movePart(id, 1), dup: () => duplicatePart(id), del: () => removePart(id), close: () => select(null) })[b.dataset.act]();
    return;
  }
  if (!r) return;
  const p = r.part;
  if (b.dataset.seg) {
    const k = b.dataset.seg; let v = b.dataset.v; if (b.dataset.t === 'num') v = Number(v);
    if (k === 'count') H.setColumnCount(p, v);
    else if (k === 'split') v.split(',').forEach((w, i) => { if (p.cols[i]) p.cols[i].w = Number(w); });
    else p[k] = v;
    touch(); refresh({ inspector: true }); return;
  }
  if (b.dataset.fill) { p.width = H.slotWidth(d, SYS, p.id); touch(); refresh({ inspector: true }); return; }
  if (b.dataset.swap) { p.cols.reverse(); touch(); refresh({ inspector: true }); return; }
  if (b.dataset.itemAct) {
    const i = +b.dataset.i;
    if (b.dataset.itemAct === 'add') { if (p.items.length < p.max) p.items.push(H.newItem(p)); }
    if (b.dataset.itemAct === 'del') { if (p.items.length > p.min) p.items.splice(i, 1); else { ToolKit.toast(`The group starts with at least ${p.min}`); return; } }
    if (b.dataset.itemAct === 'up' && i > 0) p.items.splice(i - 1, 0, p.items.splice(i, 1)[0]);
    if (b.dataset.itemAct === 'down' && i < p.items.length - 1) p.items.splice(i + 1, 0, p.items.splice(i, 1)[0]);
    touch(); refresh({ inspector: true });
  }
});

// ---------------------------------------------------------------------------------------------------------------
// Bar, library and file wiring
// ---------------------------------------------------------------------------------------------------------------

function setTab(t) { ui.tab = t; saveUi(); renderBar(); if (t === 'design') paintPreview(); if (t === 'code') renderCode(); if (t === 'steps') renderSteps(); }
// The inspector's head is as tall as the bars over the stage (the top bar and the design bar, or the code bar), so its
// rule runs on from theirs, a wrapped design bar included.
function syncBars() {
  const second = !$('#designBar').hidden ? $('#designBar') : !$('#viewCode').hidden ? $('.codehead') : null;
  document.documentElement.style.setProperty('--bars-h', `${$('.topbar').offsetHeight + (second ? second.offsetHeight : 40)}px`);
}
new ResizeObserver(syncBars).observe($('.topbar'));
new ResizeObserver(syncBars).observe($('#designBar'));
new ResizeObserver(syncBars).observe($('.codehead'));
// Between 1024 and 1351 the inspector shares the rail's column, so the rail leads with Parts and Checks and the module
// list follows them. Moved in the page, not by CSS order, so Tab goes the way the eye does.
const railMQ = matchMedia('(min-width:1024px) and (max-width:1351px)');
function placeModules() { const m = $('#paneModules'), before = railMQ.matches ? $('#paneSys') : $('#paneParts'); if (m.nextElementSibling !== before) before.before(m); }
railMQ.addEventListener('change', placeModules); placeModules();
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
// The tab list's own keys: ← → Home End move between the views and open the one they land on.
$('#tabs').addEventListener('keydown', e => {
  const tabs = $$('#tabs button'), i = tabs.indexOf(e.target); if (i < 0) return;
  const j = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
  if (j == null) return;
  e.preventDefault(); setTab(tabs[j].dataset.tab); tabs[j].focus();
});
// A focused code pane keeps ↑ ↓ for scrolling instead of handing them to the part shortcuts.
$('#codeSrc').addEventListener('keydown', e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.stopPropagation(); });
$('#device').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.device = b.dataset.device; saveUi(); renderBar(); paintPreview(); });
$('#content').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.empty = b.dataset.content === 'empty'; saveUi(); renderBar(); paintPreview(); });
$('#darkSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.dark = b.dataset.dark === '1'; saveUi(); renderBar(); paintPreview(); });
$('#clientSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.gmail = b.dataset.client === 'gmail'; saveUi(); renderBar(); paintPreview(); });
$('#themeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.theme = b.dataset.theme; renderBar(); paintPreview(); });
$('#lib').addEventListener('click', e => { const b = e.target.closest('button.item'); if (b && b.dataset.id !== state.openId) openModule(b.dataset.id); });
$('#btnNew').addEventListener('click', e => starterMenu(e.currentTarget));
$('#btnDup').addEventListener('click', duplicateModule);
$('#btnDel').addEventListener('click', deleteModule);
$('#btnSaveFile').addEventListener('click', saveFile);
$('#btnOpenFile').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; });
$('#btnZip').addEventListener('click', downloadZip);
function flash(btn, msg) { const t = btn.textContent; btn.textContent = msg; setTimeout(() => { btn.textContent = t; }, 1300); }
$('#copyRecipe').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(recipeText); flash($('#copyRecipe'), 'Copied'); }
  catch (e) { flash($('#copyRecipe'), 'Clipboard blocked'); }
});
document.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (f && /\.json$/i.test(f.name)) { e.preventDefault(); openFile(f); } });

// ---------------------------------------------------------------------------------------------------------------
// Keys. The toolkit owns ⌘Z, ?, Esc and reset; these are this tool's own.
// ---------------------------------------------------------------------------------------------------------------

Object.assign(state, defaults());   // the starters, until the toolkit finds saved work and replaces them
ToolKit.init({
  tool: 'hub-mod', version: 1,
  getState: () => clone(state),
  setState: s => {
    let next = s && typeof s === 'object' && s.library && typeof s.library === 'object' && Array.isArray(s.order) ? s : defaults();
    for (const id of Object.keys(next.library)) {
      const m = next.library[id];
      if (!m || typeof m !== 'object' || Array.isArray(m) || !Array.isArray(m.parts)) delete next.library[id];
      else next.library[id] = H.migrate(m);
    }
    next.order = next.order.filter(id => typeof id === 'string' && next.library[id]);
    if (!next.order.length) next = defaults();
    if (!next.library[next.openId]) next.openId = next.order[0];
    // Every key set outright: a missing openId must not leave the previous one standing.
    const c = clone(next); state.library = c.library; state.order = c.order; state.openId = next.openId;
    refresh({ inspector: true });
  },
  defaults,
  // Reset clears the saved view settings and hand-build ticks too; without this the ones in memory were written back
  // at the next click.
  onReset: () => Object.assign(ui, uiDefaults()),
});
// The toolkit's storage is namespaced by the tool it was given, so the view settings come back only after init.
try { Object.assign(ui, ToolKit.loadAux('ui', true) || {}); } catch (e) {}
ui.sel = null;
ToolKit.register('d', 'Design view', () => setTab('design'), { group: 'View' });
ToolKit.register('c', 'Code view', () => setTab('code'), { group: 'View' });
ToolKit.register('b', 'Hand-build steps', () => setTab('steps'), { group: 'View' });
ToolKit.register('p', 'Desktop or phone', () => { ui.device = ui.device === 'phone' ? 'desktop' : 'phone'; saveUi(); renderBar(); paintPreview(); }, { group: 'View' });
ToolKit.register('e', 'Filled or empty fields', () => { ui.empty = !ui.empty; saveUi(); renderBar(); paintPreview(); }, { group: 'View' });
ToolKit.register('k', 'Email dark mode, on or off', () => { ui.dark = !ui.dark; saveUi(); renderBar(); paintPreview(); }, { group: 'View' });
ToolKit.register('g', 'Gmail view: no style block', () => { ui.gmail = !ui.gmail; saveUi(); renderBar(); paintPreview(); }, { group: 'View' });
ToolKit.register('n', 'New module', () => starterMenu($('#btnNew')), { group: 'Module' });
ToolKit.register('a', 'Add a part', () => { const r = ui.sel && locate(ui.sel); if (r) addMenu($('.orow.on') || $('#outline .oadd'), r.list, r.owner, r.index + 1); else addMenu($('#outline > div > .oadd'), doc().parts, null); }, { group: 'Parts' });
ToolKit.register('alt+up', 'Move part up', () => ui.sel && movePart(ui.sel, -1), { group: 'Parts' });
ToolKit.register('alt+down', 'Move part down', () => ui.sel && movePart(ui.sel, 1), { group: 'Parts' });
ToolKit.register('mod+d', 'Duplicate part', () => ui.sel && duplicatePart(ui.sel), { group: 'Parts' });
ToolKit.register('backspace', 'Delete part', () => ui.sel && removePart(ui.sel), { group: 'Parts' });
ToolKit.register('delete', 'Delete part', () => ui.sel && removePart(ui.sel), { group: 'Parts', hidden: true });
ToolKit.register('up', 'Previous part', () => stepSel(-1), { group: 'Parts' });
ToolKit.register('down', 'Next part', () => stepSel(1), { group: 'Parts' });
ToolKit.register('mod+s', 'Download .zip', () => downloadZip(), { group: 'Export' });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menuEl && ui.sel && !e.target.closest?.('input,textarea,select')) select(null); if (e.key === 'Escape') closeMenu(); });
function stepSel(dir) {
  const flat = allParts(); if (!flat.length) return;
  const i = flat.findIndex(p => p.id === ui.sel);
  select(flat[i < 0 ? 0 : Math.max(0, Math.min(flat.length - 1, i + dir))].id);
}

// The design system: read the live file when served, so a change in Template Studio's Switchyards system reaches
// here without a second copy to keep in step (learnings 3.48). The built-in copy covers a double-clicked file.
fetch(`../${SYS_PATH}`).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
  SYS = H.normalizeSystem(j); sysLive = true;
}).catch(() => {}).finally(() => {
  $('#sysNote').innerHTML = sysLive ? `Design system: <span class="path">${esc(SYS_PATH)}</span>` : 'Design system: built-in copy of switchyards.system.json';
  refresh({ inspector: true });
});
refresh({ inspector: true });
</script>
</body>
</html>
